name: Merge economic lineage into integration

on:
  push:
    branches:
      - agent/integration-hoda-bahar-after-groups

permissions:
  contents: write

jobs:
  merge-economic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch economic source
        run: git fetch origin agent/stock-bahar-external-capital:refs/remotes/origin/agent/stock-bahar-external-capital

      - name: Merge and resolve known semantic conflicts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=origin/agent/stock-bahar-external-capital
          if git merge-base --is-ancestor "$SOURCE" HEAD; then
            echo "Economic source is already integrated."
            exit 0
          fi

          git config user.name "EarthCoop Integration Bot"
          git config user.email "integration@earthcoop.invalid"

          set +e
          git merge --no-commit --no-ff "$SOURCE"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' \
              app/Console/Kernel.php \
              app/Http/Controllers/NajmBaharController.php \
              app/Modules/NajmBahar/Services/AccountService.php \
              app/Providers/NajmHodaServiceProvider.php | sort)"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflicts detected:"
              echo "$conflicts"
              git merge --abort || true
              exit 1
            fi

            # Kernel: keep economic Laravel-compatible schedule and restore group outbox/session schedules.
            git checkout --theirs app/Console/Kernel.php
            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Console/Kernel.php')
          s = p.read_text()
          s = s.replace(
              "        \\App\\Console\\Commands\\SendAuctionReminders::class,\n",
              "        \\App\\Console\\Commands\\SendAuctionReminders::class,\n        \\App\\Console\\Commands\\ActivateScheduledGroupSessions::class,\n",
              1,
          )
          s = s.replace(
              "        $schedule->command('auctions:close')->everyMinute();\n",
              "        $schedule->command('auctions:close')->everyMinute();\n\n        // Group chat transactional outbox and scheduled sessions from the post-groups main baseline.\n        $schedule->command('group-chat:dispatch-outbox --limit=500')->everyMinute()->withoutOverlapping();\n        $schedule->command('group-chat:activate-sessions')->everyMinute()->withoutOverlapping();\n",
              1,
          )
          p.write_text(s)
          PY

            # Najm Bahar controller: use hardened economic implementation while preserving system-identity isolation
            # and member-only population semantics introduced on main.
            git checkout --theirs app/Http/Controllers/NajmBaharController.php
            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Http/Controllers/NajmBaharController.php')
          s = p.read_text()
          old = """    public function showAgreement()\n    {\n        $user = auth()->user();\n\n        if ($this->accountService->hasMainAccount($user->id)) {\n            return redirect()->route('najm-bahar.dashboard')\n                ->with('info', 'شما قبلاً حساب نجم بهار دارید.');\n        }\n"""
          new = """    public function showAgreement()\n    {\n        $user = auth()->user();\n        abort_if($user->isSystemIdentity(), 403, 'System identities cannot use Najm Bahar.');\n\n        $hasAcceptedAgreement = $this->accountService->hasMainAccount($user->id)\n            || ! is_null($user->najm_bahar_agreement_accepted_at);\n"""
          if old not in s:
              raise SystemExit('showAgreement merge anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              "        return view('najm-bahar.agreement', compact('agreements', 'isProfileComplete'));",
              "        return view('najm-bahar.agreement', compact('agreements', 'isProfileComplete', 'hasAcceptedAgreement'));",
              1,
          )
          anchor = """        $user = auth()->user();\n\n        if ($this->accountService->hasMainAccount($user->id)) {\n"""
          replacement = """        $user = auth()->user();\n        abort_if($user->isSystemIdentity(), 403, 'System identities cannot use Najm Bahar.');\n\n        if ($this->accountService->hasMainAccount($user->id)) {\n"""
          if anchor not in s:
              raise SystemExit('processAgreement merge anchor not found')
          s = s.replace(anchor, replacement, 1)
          s = s.replace('$userCount = User::count();', '$userCount = User::members()->count();', 1)
          p.write_text(s)
          PY

            # AccountService: preserve economic treasury/subaccount hardening and main's system-identity guard.
            git checkout --theirs app/Modules/NajmBahar/Services/AccountService.php
            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Modules/NajmBahar/Services/AccountService.php')
          s = p.read_text()
          s = s.replace(
              "use App\\Modules\\NajmBahar\\Models\\Transaction;\n",
              "use App\\Modules\\NajmBahar\\Models\\Transaction;\nuse App\\Models\\User;\nuse InvalidArgumentException;\n",
              1,
          )
          anchor = """    public function createMainAccountForUser(int $userId, string $name = 'NajmBahar Account'): Account\n    {\n        $accountNumber = AccountNumberService::makeMainAccountNumberForUser($userId);\n"""
          replacement = """    public function createMainAccountForUser(int $userId, string $name = 'NajmBahar Account'): Account\n    {\n        if (User::whereKey($userId)->where('is_system', true)->exists()) {\n            throw new InvalidArgumentException('System identities cannot own Najm Bahar accounts.');\n        }\n\n        $accountNumber = AccountNumberService::makeMainAccountNumberForUser($userId);\n"""
          if anchor not in s:
              raise SystemExit('AccountService merge anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY

            # Provider: keep hardened constructor resolution but preserve main's removal of per-request boot logging.
            git checkout --theirs app/Providers/NajmHodaServiceProvider.php
            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Providers/NajmHodaServiceProvider.php')
          s = p.read_text()
          s = s.replace("        Log::info('نجم‌هدا راه‌اندازی شد');\n", "        // Do not log a successful provider boot on every polling request.\n", 1)
          p.write_text(s)
          PY

            git add app/Console/Kernel.php \
              app/Http/Controllers/NajmBaharController.php \
              app/Modules/NajmBahar/Services/AccountService.php \
              app/Providers/NajmHodaServiceProvider.php
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git add -A
          git commit -m "Integrate economic system after group hardening"
          git push origin HEAD:agent/integration-hoda-bahar-after-groups
