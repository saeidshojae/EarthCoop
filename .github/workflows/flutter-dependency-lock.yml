name: Flutter Dependency Lock Gate

on:
  push:
    branches:
      - main
      - agent/flutter-native-client-foundation-20260929
    paths:
      - 'apps/mobile/pubspec.yaml'
      - 'apps/mobile/pubspec.lock'
      - '.github/workflows/flutter-dependency-lock.yml'
  pull_request:
    paths:
      - 'apps/mobile/pubspec.yaml'
      - 'apps/mobile/pubspec.lock'
      - '.github/workflows/flutter-dependency-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Commit resolved lockfile on the M6 branch
        if: github.event_name == 'push' && github.ref_name == 'agent/flutter-native-client-foundation-20260929'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/mobile/pubspec.lock; then
            echo 'pubspec.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/pubspec.lock
          git commit -m 'chore(mobile): sync Flutter dependency lock [m6-device-uat-version]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Verify lockfile is committed
        run: git diff --exit-code -- apps/mobile/pubspec.lock
