name: Flutter Dependency Lock Gate

on:
  push:
    branches:
      - main
      - agent/flutter-native-client-foundation-20260929
    paths:
      - 'apps/mobile/pubspec.yaml'
      - 'apps/mobile/pubspec.lock'
      - '.github/workflows/flutter-dependency-lock.yml'
  pull_request:
    paths:
      - 'apps/mobile/pubspec.yaml'
      - 'apps/mobile/pubspec.lock'
      - '.github/workflows/flutter-dependency-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Verify lockfile is committed
        run: git diff --exit-code -- apps/mobile/pubspec.lock
