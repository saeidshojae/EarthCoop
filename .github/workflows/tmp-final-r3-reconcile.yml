name: Final Integration R3 Diagnostic

on:
  push:
    branches:
      - agent/pre-main-final-integration-20260908

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose post-freeze R3 merge
        run: |
          git config user.name "integration-diagnostic"
          git config user.email "integration-diagnostic@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/agent/r3-reputation-close
          code=$?
          echo "MERGE_EXIT=$code"
          echo "--- UNMERGED FILES ---"
          git diff --name-only --diff-filter=U || true
          echo "--- STATUS ---"
          git status --short || true
          if [ "$code" -eq 0 ]; then git merge --abort || true; echo MERGE_CLEAN; exit 0; fi
          git merge --abort || true
          exit 1
