name: Native Bahar activation focused contracts

on:
  push:
    branches: [agent/mobile-bahar-activation-20261008]
    paths:
      - '.github/workflows/mobile-bahar-activation-focused.yml'
      - 'app/Http/Controllers/API/V1/NajmBaharActivationController.php'
      - 'app/Modules/NajmBahar/Services/Api/NajmBaharActivationApplicationService.php'
      - 'app/Services/ReputationService.php'
      - 'tests/Feature/Api/V1/NajmBaharActivationContractTest.php'
      - 'tests/Support/NajmBaharActivationConcurrencyProbe.php'
      - 'tests/Support/NajmBaharActivationCrossWriterProbe.php'

permissions:
  contents: read

concurrency:
  group: mobile-bahar-activation-focused
  cancel-in-progress: true

jobs:
  focused-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Prepare isolated Laravel runtime
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --no-audit --no-fund
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          php artisan migrate:fresh --force
          npm run build
          test -f public/build/manifest.json
      - name: Activation API contracts
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmBaharActivationContractTest.php
      - name: Parallel financial activation MySQL race probe
        run: |
          set -euo pipefail
          php tests/Support/NajmBaharActivationConcurrencyProbe.php setup
          php tests/Support/NajmBaharActivationConcurrencyProbe.php worker 1 > /tmp/bahar-race-worker-1.log 2>&1 &
          p1=$!
          php tests/Support/NajmBaharActivationConcurrencyProbe.php worker 2 > /tmp/bahar-race-worker-2.log 2>&1 &
          p2=$!
          for attempt in $(seq 1 100); do
            if test -f storage/framework/activation-concurrency/ready-1 && test -f storage/framework/activation-concurrency/ready-2; then break; fi
            sleep 0.1
          done
          test -f storage/framework/activation-concurrency/ready-1
          test -f storage/framework/activation-concurrency/ready-2
          php tests/Support/NajmBaharActivationConcurrencyProbe.php release
          wait "$p1" || { cat /tmp/bahar-race-worker-1.log; exit 1; }
          wait "$p2" || { cat /tmp/bahar-race-worker-2.log; exit 1; }
          php tests/Support/NajmBaharActivationConcurrencyProbe.php verify
      - name: Concurrent participation reversal versus financial activation
        run: |
          set -euo pipefail
          php tests/Support/NajmBaharActivationCrossWriterProbe.php setup
          php tests/Support/NajmBaharActivationCrossWriterProbe.php worker activate > /tmp/bahar-crosswriter-activate.log 2>&1 &
          p1=$!
          php tests/Support/NajmBaharActivationCrossWriterProbe.php worker reverse > /tmp/bahar-crosswriter-reverse.log 2>&1 &
          p2=$!
          for attempt in $(seq 1 100); do
            if test -f storage/framework/activation-crosswriter/ready-activate && test -f storage/framework/activation-crosswriter/ready-reverse; then break; fi
            sleep 0.1
          done
          test -f storage/framework/activation-crosswriter/ready-activate
          test -f storage/framework/activation-crosswriter/ready-reverse
          php tests/Support/NajmBaharActivationCrossWriterProbe.php release
          wait "$p1" || { cat /tmp/bahar-crosswriter-activate.log; exit 1; }
          wait "$p2" || { cat /tmp/bahar-crosswriter-reverse.log; exit 1; }
          php tests/Support/NajmBaharActivationCrossWriterProbe.php verify
      - name: Financial mutation boundary
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Architecture/NajmBaharFinancialMutationBoundaryTest.php
