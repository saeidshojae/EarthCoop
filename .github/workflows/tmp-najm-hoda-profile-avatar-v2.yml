name: Najm Hoda Profile Avatar Apply V2

on:
  push:
    branches:
      - agent/najm-hoda-widget-viewport-safety

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
          chmod -R 777 bootstrap/cache storage
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Confirm RED
        run: |
          set +e
          php artisan test tests/Feature/NajmHoda/NajmHodaWidgetAvatarContractTest.php
          code=$?
          set -e
          test "$code" -ne 0
      - name: Apply focused patch
        run: python scripts/apply_najm_hoda_profile_avatar.py
      - name: Verify
        run: |
          php -l app/Http/Controllers/Profile/ProfileController.php
          php -l tests/Feature/NajmHoda/NajmHodaWidgetAvatarContractTest.php
          php artisan test tests/Feature/NajmHoda/NajmHodaWidgetAvatarContractTest.php
          node --check resources/js/najm-hoda-widget-layout.js
          grep -q "visualViewport" resources/js/najm-hoda-widget-layout.js
          grep -q "ResizeObserver" resources/js/najm-hoda-widget-layout.js
          grep -q "telegram-style-input" resources/js/najm-hoda-widget-layout.js
          php artisan route:list --name=najm-hoda.profile
      - name: Commit implementation
        run: |
          rm -f .github/workflows/tmp-najm-hoda-profile-avatar.yml
          rm -f .github/workflows/tmp-najm-hoda-profile-avatar-v2.yml
          rm -f scripts/apply_najm_hoda_profile_avatar.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: give Najm Hoda a stable profile and avatar identity"
          git push
