name: M6 Flutter Task 13 TDD

on:
  push:
    branches:
      - agent/flutter-native-client-foundation-20260929
    paths:
      - 'apps/mobile/integration_test/**'
      - 'apps/mobile/test/acceptance/**'
      - 'apps/mobile/lib/app/router/**'
      - 'apps/mobile/lib/features/home/**'
      - 'apps/mobile/lib/features/groups/**'
      - 'apps/mobile/lib/features/notifications/**'
      - 'apps/mobile/docs/DEVICE_ACCEPTANCE.md'
      - '.github/workflows/mobile-uat-publish.yml'
      - '.github/workflows/m6-flutter-task13.yml'

permissions:
  contents: read

jobs:
  vertical-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check formatting
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          scopes=(test/acceptance integration_test/m6_vertical_slice_test.dart integration_test/offline_reconnect_test.dart integration_test/deep_link_notification_test.dart lib/app/router lib/features/home lib/features/groups lib/features/notifications)
          dart format "${scopes[@]}"
          git diff -- "${scopes[@]}"
          git diff --exit-code -- "${scopes[@]}"
      - name: Analyze acceptance scope
        working-directory: apps/mobile
        run: flutter analyze test/acceptance integration_test/m6_vertical_slice_test.dart integration_test/offline_reconnect_test.dart integration_test/deep_link_notification_test.dart lib/app/router lib/features/home lib/features/groups lib/features/notifications
      - name: Run deterministic M6 acceptance contracts
        working-directory: apps/mobile
        run: flutter test test/acceptance
