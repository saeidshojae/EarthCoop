name: M1 API v1 Targeted Gate

on:
  push:
    branches:
      - agent/m0-api-constitution-mobile-readiness-20260927
    paths:
      - 'app/**'
      - 'routes/**'
      - 'tests/Feature/Api/V1/**'
      - '.github/workflows/m1-api-v1-targeted.yml'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

concurrency:
  group: m1-api-v1-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          EOF
          php artisan key:generate --force
      - name: Run current M1 API v1 targeted suite
        run: php artisan test tests/Feature/Api/V1
