name: M1 API v1 Targeted Gate

on:
  push:
    branches:
      - agent/m0-api-constitution-mobile-readiness-20260927
      - agent/flutter-native-client-foundation-20260929
    paths:
      - 'app/**'
      - 'database/migrations/**'
      - 'routes/**'
      - 'tests/Feature/Api/V1/**'
      - 'tests/Feature/LocationGovernance/**'
      - 'tests/Feature/GroupChat/**'
      - 'tests/Feature/Elections/**'
      - '.github/workflows/m1-api-v1-targeted.yml'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

concurrency:
  group: m1-api-v1-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          mysql --host=127.0.0.1 --port=3306 --user=root -e 'CREATE DATABASE IF NOT EXISTS `newearthcoop-test` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          cp phpunit.xml.dist phpunit.m1.xml
          sed -i 's/name="DB_CONNECTION" value="mysql" force="true"/name="DB_CONNECTION" value="sqlite" force="true"/' phpunit.m1.xml
          sed -i 's/name="DB_DATABASE" value="newearthcoop-test" force="true"/name="DB_DATABASE" value=":memory:" force="true"/' phpunit.m1.xml
      - name: Run fast M1 API v1 contracts
        run: |
          vendor/bin/phpunit -c phpunit.m1.xml \
            --exclude-group mysql-location \
            --exclude-group mysql-group \
            --exclude-group mysql-core-journeys \
            --exclude-group mysql-core-journey \
            --log-junit storage/logs/m1-api-v1-junit.xml \
            tests/Feature/Api/V1
      - name: Upload fast M1 API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-api-v1-fast-junit
          path: storage/logs/m1-api-v1-junit.xml
          if-no-files-found: error
          retention-days: 7
      - name: Run Location/Governance v1 and canonical parity contracts
        run: |
          vendor/bin/phpunit -c phpunit.xml.dist \
            tests/Feature/Api/V1/LocationGovernanceContractTest.php \
            tests/Feature/LocationGovernance/LocationSelectionApiTest.php \
            tests/Feature/LocationGovernance/ResidencePickerDeepHardeningTest.php
      - name: Run Groups/Feed v1 and mature feed parity contracts
        run: |
          vendor/bin/phpunit -c phpunit.xml.dist \
            tests/Feature/Api/V1/GroupContractTest.php \
            tests/Feature/GroupChat/FeedCursorTest.php
      - name: Run mature Election and Project backend parity contracts
        run: |
          vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Elections/ElectionBallotServiceTest.php
          vendor/bin/phpunit -c phpunit.xml.dist --filter '/test_canonical_project_(store|update)/' \
            tests/Feature/LocationGovernance/ProjectScopeCutoverFlagTest.php
      - name: Run Task 8 v1 Election/Project/Notification contracts
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/ElectionProjectNotificationContractTest.php
      - name: Run M1-C non-browser core journey acceptance
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/CoreJourneyTest.php
      - name: Run native session full-schema isolation regression
        run: |
          DB_DATABASE=newearthcoop-test php artisan migrate:fresh --force
          vendor/bin/phpunit -c phpunit.xml.dist \
            tests/Feature/Api/V1/NativeSessionTest.php \
            tests/Feature/SystemIdentityIsolationTest.php
