name: FCM system notification open checkpoint
on:
  push:
    branches: [agent/fcm-open-20261005]
permissions:
  contents: read
jobs:
  open-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter test test/core/push/authorized_push_open_test.dart test/core/push/fcm_message_binding_test.dart
