name: FCM system notification open checkpoint
on:
  push:
    branches: [agent/fcm-open-20261005]
permissions:
  contents: read
concurrency:
  group: fcm-open-checkpoint
  cancel-in-progress: true
jobs:
  review-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter test test/core/push/fcm_message_binding_test.dart test/features/notifications/notifications_runtime_view_test.dart
