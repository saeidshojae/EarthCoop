name: Apply adaptive invitation share patch

on:
  push:
    branches:
      - agent/welcome-community-stories
    paths:
      - .github/workflows/apply-adaptive-invite-share.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply adaptive invitation share patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/welcome-community-stories
          fetch-depth: 0

      - name: Patch routed invitation view
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('resources/views/profile/member-invitations.blade.php')
          text = path.read_text(encoding='utf-8')

          css_old = """    .invite-toast.show {
        opacity: 1;
        transform: translateX(50%) translateY(0);
    }
"""
          css_new = css_old + """    .invite-share-layer {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: rgba(15, 23, 42, .46);
        backdrop-filter: blur(4px);
    }
    .invite-share-layer.show { display: flex; }
    .invite-share-dialog {
        width: min(100%, 28rem);
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        border-radius: 1.5rem;
        background: #fff;
        box-shadow: 0 24px 70px rgba(15, 23, 42, .28);
    }
"""
          if css_old not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(css_old, css_new, 1)

          markup_old = """<div id=\"inviteToast\" class=\"invite-toast rounded-full bg-slate-900 text-white px-5 py-3 text-sm font-bold shadow-xl\" role=\"status\" aria-live=\"polite\"></div>
@endsection
"""
          markup_new = """<div id=\"inviteShareMenu\" class=\"invite-share-layer\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"inviteShareTitle\" aria-hidden=\"true\" onclick=\"handleInviteShareBackdrop(event)\">
    <div class=\"invite-share-dialog p-5 sm:p-6\" dir=\"rtl\">
        <div class=\"flex items-start justify-between gap-4 mb-5\">
            <div>
                <h2 id=\"inviteShareTitle\" class=\"text-xl font-extrabold text-slate-900 mb-1\">اشتراک دعوت</h2>
                <p class=\"text-sm leading-6 text-slate-500 mb-0\">روش مناسب برای فرستادن دعوت را انتخاب کنید.</p>
            </div>
            <button type=\"button\" onclick=\"closeInviteShareMenu()\" class=\"w-10 h-10 rounded-full border border-slate-200 bg-white text-slate-500 flex items-center justify-center cursor-pointer shrink-0\" aria-label=\"بستن\">
                <i class=\"fas fa-times\" aria-hidden=\"true\"></i>
            </button>
        </div>

        <div class=\"grid grid-cols-2 gap-3 mb-4\">
            <button type=\"button\" onclick=\"shareInviteToWhatsApp()\" class=\"rounded-2xl border border-emerald-200 bg-emerald-50 text-emerald-800 px-4 py-4 font-bold flex items-center justify-center gap-2 cursor-pointer\">
                <i class=\"fab fa-whatsapp text-xl\" aria-hidden=\"true\"></i> واتساپ
            </button>
            <button type=\"button\" onclick=\"shareInviteToTelegram()\" class=\"rounded-2xl border border-sky-200 bg-sky-50 text-sky-800 px-4 py-4 font-bold flex items-center justify-center gap-2 cursor-pointer\">
                <i class=\"fab fa-telegram-plane text-xl\" aria-hidden=\"true\"></i> تلگرام
            </button>
        </div>

        <div class=\"space-y-2\">
            <button type=\"button\" onclick=\"copyCurrentInviteMessage()\" class=\"w-full rounded-full border border-slate-300 bg-white text-slate-700 px-5 py-3.5 font-bold flex items-center justify-center gap-2 cursor-pointer\">
                <i class=\"far fa-copy\" aria-hidden=\"true\"></i> کپی متن کامل دعوت
            </button>
            <button type=\"button\" onclick=\"copyCurrentInviteLink()\" class=\"w-full rounded-full border border-slate-300 bg-white text-slate-700 px-5 py-3.5 font-bold flex items-center justify-center gap-2 cursor-pointer\">
                <i class=\"fas fa-link\" aria-hidden=\"true\"></i> کپی لینک دعوت
            </button>
            <button id=\"systemInviteShareButton\" type=\"button\" onclick=\"shareInviteViaSystem()\" class=\"hidden w-full rounded-full bg-slate-900 text-white px-5 py-3.5 font-bold items-center justify-center gap-2 cursor-pointer border-0\">
                <i class=\"fas fa-share-nodes\" aria-hidden=\"true\"></i> اشتراک از طریق سیستم
            </button>
        </div>
    </div>
</div>

<div id=\"inviteToast\" class=\"invite-toast rounded-full bg-slate-900 text-white px-5 py-3 text-sm font-bold shadow-xl\" role=\"status\" aria-live=\"polite\"></div>
@endsection
"""
          if markup_old not in text:
              raise SystemExit('Markup anchor not found')
          text = text.replace(markup_old, markup_new, 1)

          js_old = """const invitationWelcomeUrl = @json(url('/'));

function buildInviteMessage(code) {
    const url = invitationWelcomeUrl + '?invite=' + encodeURIComponent(code);
    return `من به EarthCoop پیوسته‌ام؛ بستری برای همکاری و مشارکت از محله تا جهان.\\nاگر دوست داری تو هم از اعضای نخستین باشی، با دعوت من بپیوند.\\nکد دعوت: ${code}\\n${url}`;
}
"""
          js_new = """const invitationWelcomeUrl = @json(url('/'));
let activeInviteCode = null;
let inviteShareReturnFocus = null;

function buildInviteUrl(code) {
    return invitationWelcomeUrl + '?invite=' + encodeURIComponent(code);
}

function buildInviteMessage(code) {
    const url = buildInviteUrl(code);
    return `من به EarthCoop پیوسته‌ام؛ بستری برای همکاری و مشارکت از محله تا جهان.\\nاگر دوست داری تو هم از اعضای نخستین باشی، با دعوت من بپیوند.\\nکد دعوت: ${code}\\n${url}`;
}

function isMobileShareContext() {
    const mobileUserAgent = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
    const compactTouchViewport = window.matchMedia('(max-width: 767px)').matches && (navigator.maxTouchPoints || 0) > 0;
    return mobileUserAgent || compactTouchViewport;
}
"""
          if js_old not in text:
              raise SystemExit('JS message anchor not found')
          text = text.replace(js_old, js_new, 1)

          share_old = """async function shareInviteCode(code) {
    const message = buildInviteMessage(code);

    if (navigator.share) {
        try {
            await navigator.share({ title: 'دعوت به EarthCoop', text: message });
            return;
        } catch (error) {
            if (error && error.name === 'AbortError') return;
        }
    }

    copyToClipboard(message);
}

function copyInviteCode(code) {
    copyToClipboard(buildInviteMessage(code));
}
"""
          share_new = """function openInviteShareMenu(code) {
    activeInviteCode = code;
    inviteShareReturnFocus = document.activeElement;
    const menu = document.getElementById('inviteShareMenu');
    const systemButton = document.getElementById('systemInviteShareButton');
    if (!menu) return;

    if (systemButton) {
        systemButton.classList.toggle('hidden', !navigator.share);
        systemButton.classList.toggle('flex', !!navigator.share);
    }

    menu.classList.add('show');
    menu.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    menu.querySelector('button')?.focus();
}

function closeInviteShareMenu() {
    const menu = document.getElementById('inviteShareMenu');
    if (!menu) return;
    menu.classList.remove('show');
    menu.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    inviteShareReturnFocus?.focus?.();
    inviteShareReturnFocus = null;
}

function handleInviteShareBackdrop(event) {
    if (event.target && event.target.id === 'inviteShareMenu') closeInviteShareMenu();
}

function openInviteShareTarget(url) {
    window.open(url, '_blank', 'noopener,noreferrer');
}

function shareInviteToWhatsApp() {
    if (!activeInviteCode) return;
    openInviteShareTarget('https://wa.me/?text=' + encodeURIComponent(buildInviteMessage(activeInviteCode)));
    closeInviteShareMenu();
}

function shareInviteToTelegram() {
    if (!activeInviteCode) return;
    const url = buildInviteUrl(activeInviteCode);
    const message = buildInviteMessage(activeInviteCode).replace(url, '').trim();
    openInviteShareTarget('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(message));
    closeInviteShareMenu();
}

function copyCurrentInviteMessage() {
    if (!activeInviteCode) return;
    copyToClipboard(buildInviteMessage(activeInviteCode));
    closeInviteShareMenu();
}

function copyCurrentInviteLink() {
    if (!activeInviteCode) return;
    copyToClipboard(buildInviteUrl(activeInviteCode)).then(() => showInviteToast('لینک دعوت کپی شد.'));
    closeInviteShareMenu();
}

async function shareInviteViaSystem() {
    if (!activeInviteCode || !navigator.share) return;
    try {
        await navigator.share({ title: 'دعوت به EarthCoop', text: buildInviteMessage(activeInviteCode) });
        closeInviteShareMenu();
    } catch (error) {
        if (error && error.name === 'AbortError') return;
    }
}

async function shareInviteCode(code) {
    const message = buildInviteMessage(code);

    if (isMobileShareContext() && navigator.share) {
        try {
            await navigator.share({ title: 'دعوت به EarthCoop', text: message });
            return;
        } catch (error) {
            if (error && error.name === 'AbortError') return;
        }
    }

    openInviteShareMenu(code);
}

function copyInviteCode(code) {
    copyToClipboard(buildInviteMessage(code));
}

document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeInviteShareMenu();
});
"""
          if share_old not in text:
              raise SystemExit('Share anchor not found')
          text = text.replace(share_old, share_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit adaptive share UX
        shell: bash
        run: |
          git config user.name "EarthCoop CI"
          git config user.email "actions@users.noreply.github.com"
          git add resources/views/profile/member-invitations.blade.php
          git diff --cached --check
          git commit -m "fix: adapt invitation sharing by device"
          git push origin HEAD:agent/welcome-community-stories
