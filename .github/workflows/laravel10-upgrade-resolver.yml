name: Laravel 10 Upgrade Resolver

on:
  push:
    branches:
      - agent/najm-hoda-hardening
    paths:
      - 'docs/LARAVEL10_UPGRADE_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/najm-hoda-hardening

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, zip, gd, pdo_mysql
          coverage: none

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache storage/framework/sessions
          chmod -R 775 bootstrap/cache storage/framework

      - name: Install current dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Laravel 10 compatible constraints
        run: |
          composer require laravel/framework:^10.0 laravel/sanctum:^3.2 doctrine/dbal:^3.0 spatie/laravel-ignition:^2.0 --no-update --no-interaction

      - name: Resolve Laravel 10 dependency graph
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Audit production dependencies
        run: composer audit --no-dev --format=summary || true

      - name: Commit Composer-generated upgrade
        run: |
          if git diff --quiet -- composer.json composer.lock; then
            echo 'No dependency changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          git commit -m 'upgrade: resolve Laravel 10 dependency baseline'
          git push origin HEAD:agent/najm-hoda-hardening
