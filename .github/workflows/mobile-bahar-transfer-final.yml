name: Native Bahar transfer final

# Final rerun: no-eligible-source capability review fix is pinned.

on:
  push:
    branches: [agent/mobile-bahar-transfer-20261007]
    paths:
      - '.github/workflows/mobile-bahar-transfer-final.yml'

permissions:
  contents: read

concurrency:
  group: native-bahar-transfer-final
  cancel-in-progress: true

jobs:
  final-server:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Prepare isolated Laravel test runtime
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs final-transfer-evidence
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --no-audit --no-fund
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          php artisan migrate:fresh --force
          npm run build
          test -f public/build/manifest.json
          grep -F 'resources/js/app.js' public/build/manifest.json >/dev/null
      - name: Financial mutation architecture
        run: |
          set -o pipefail
          vendor/bin/phpunit -c phpunit.xml.dist tests/Architecture/NajmBaharFinancialMutationBoundaryTest.php 2>&1 | tee final-transfer-evidence/architecture.log
      - name: Native transfer contracts
        run: |
          set -o pipefail
          vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmBaharTransferCapabilityContractTest.php tests/Feature/Api/V1/NajmBaharTransactionContractTest.php 2>&1 | tee final-transfer-evidence/transfer-contracts.log
      - name: Full server suite
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          vendor/bin/phpunit -c phpunit.xml.dist 2>&1 | tee final-transfer-evidence/server-full.log
      - name: Retain server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bahar-transfer-final-server-${{ github.sha }}
          path: final-transfer-evidence/
          if-no-files-found: error
          retention-days: 30

  final-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Strict formatter
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyzer
        working-directory: apps/mobile
        run: flutter analyze
      - name: Complete Flutter suite
        working-directory: apps/mobile
        run: |
          set -o pipefail
          mkdir -p ../../final-transfer-mobile-evidence
          flutter test --reporter expanded 2>&1 | tee ../../final-transfer-mobile-evidence/flutter-full.log
      - name: Retain mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bahar-transfer-final-mobile-${{ github.sha }}
          path: final-transfer-mobile-evidence/
          if-no-files-found: error
          retention-days: 30
