name: Welcome Community Stories Gate

on:
  push:
    branches:
      - agent/welcome-community-stories
  pull_request:
    branches:
      - agent/current-elections-center

jobs:
  community-stories:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_community_stories
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build Vite assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_community_stories
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          EOF
          php artisan key:generate --force
      - name: Migrate schema
        run: php artisan migrate:fresh --force
      - name: Route boot
        run: php artisan route:list > /dev/null
      - name: Run community story publication contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/CommunityStories/CommunityStoryPublicationContractTest.php
      - name: Run authentic welcome stories contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/CommunityStories/WelcomeCommunityStoriesTest.php
      - name: Run voluntary story submission contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/CommunityStories/CommunityStorySubmissionTest.php
      - name: Run community story moderation contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/CommunityStories/CommunityStoryModerationTest.php
      - name: Run community story navigation contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/CommunityStories/CommunityStoryNavigationTest.php
      - name: Run Welcome CTA and invitation contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Welcome/WelcomeCtaAndInvitationContractTest.php
      - name: Run member invitation page UX contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Invitation/MemberInvitationViewContractTest.php
