name: Poll Delegation Targeted Tests

on:
  push:
    branches:
      - feature/poll-weighted-delegation
  pull_request:
    branches:
      - main
    paths:
      - 'app/Services/GroupChat/PollVoteTallyService.php'
      - 'app/Http/Controllers/Group/PollController.php'
      - 'app/Http/Controllers/Group/ChatController.php'
      - 'tests/Feature/GroupChat/PollDelegatedVoteWeightTest.php'
      - 'tests/Feature/GroupChat/PollDelegationTest.php'
      - 'database/migrations/**'
      - '.github/workflows/poll-delegation-tests.yml'

permissions:
  contents: read

jobs:
  poll-delegation-tests:
    name: Poll Delegation Feature Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions
          chmod -R 775 bootstrap/cache storage/framework

      - name: Remove tracked legacy vendor tree
        run: rm -rf vendor

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_MOCK_MODE=true
          EOF
          php artisan key:generate --force

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run weighted delegation tests
        run: vendor/bin/phpunit --display-phpunit-deprecations --configuration phpunit.xml.dist tests/Feature/GroupChat/PollDelegatedVoteWeightTest.php

      - name: Run delegation workflow regression tests
        run: vendor/bin/phpunit --display-phpunit-deprecations --configuration phpunit.xml.dist tests/Feature/GroupChat/PollDelegationTest.php
