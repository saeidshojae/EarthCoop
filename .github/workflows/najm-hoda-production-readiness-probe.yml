name: Najm Hoda Production Readiness Probe

on:
  push:
    branches:
      - agent/najm-hoda-hardening
    paths:
      - 'docs/NAJM_HODA_READINESS_PROBE_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions
          chmod -R 775 bootstrap/cache storage/framework

      - name: Remove tracked legacy vendor tree
        run: rm -rf vendor

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create probe environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=file
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_ENABLED=true
          NAJM_HODA_MOCK_MODE=true
          NAJM_HODA_RUNTIME_EVENT_BUS_DRIVER=database
          EOF
          php artisan key:generate --force
          php artisan cache:clear

      - name: Run migrations
        run: php artisan migrate --force

      - name: Verify readiness command is registered
        run: php artisan list | grep -F 'najm-hoda:production-readiness'

      - name: Run controlled GameDay cycle one
        run: php artisan najm-hoda:gameday --dry-run

      - name: Run controlled GameDay cycle two
        run: php artisan najm-hoda:gameday --dry-run

      - name: Show GameDay evidence
        run: php artisan najm-hoda:gameday --history=5

      - name: Capture readiness report
        run: php artisan najm-hoda:production-readiness --window=24 --json || true

      - name: Exercise strict readiness gate
        run: php artisan najm-hoda:production-readiness --window=24 --strict
