name: Native membership payment
on:
  push:
    branches: [agent/mobile-membership-native-20261005]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-membership-native.yml'
permissions:
  contents: read
concurrency:
  group: native-membership-payment-linux-tests
  cancel-in-progress: true
jobs:
  native-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Normalize formatting and retain exact patch
        working-directory: apps/mobile
        run: |
          dart format lib test integration_test
          echo NB_FORMAT_PATCH_BEGIN
          git diff --no-color -- lib test integration_test
          echo NB_FORMAT_PATCH_END
      - name: Native payment wire and existing retry checks
        working-directory: apps/mobile
        run: flutter test --reporter expanded test/features/najm_bahar/najm_bahar_membership_payment_repository_test.dart test/features/najm_bahar/najm_bahar_membership_payment_controller_test.dart test/features/najm_bahar/najm_bahar_membership_payment_screen_test.dart test/features/najm_bahar/najm_bahar_screen_test.dart test/features/najm_bahar/najm_bahar_navigation_test.dart test/features/najm_bahar/najm_bahar_controller_test.dart test/core/api/api_client_test.dart test/core/api/retry_policy_test.dart test/features/najm_bahar/najm_bahar_policy_test.dart test/features/najm_bahar/najm_bahar_repository_test.dart
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
