name: FTP Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
        coverage: none

    - name: Create required cache directories
      run: |
        mkdir -p bootstrap/cache
        mkdir -p storage/framework/views
        mkdir -p storage/framework/cache
        mkdir -p storage/framework/sessions
        chmod -R 775 bootstrap/cache
        chmod -R 775 storage/framework

    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

    - name: Create CI environment file
      run: |
        echo "APP_ENV=production" >> .env
        echo "APP_DEBUG=false" >> .env
        echo "APP_KEY=" >> .env
        echo "DB_CONNECTION=mysql" >> .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "DB_PORT=3306" >> .env
        echo "DB_DATABASE=dummy" >> .env
        echo "DB_USERNAME=dummy" >> .env
        echo "DB_PASSWORD=dummy" >> .env
        php artisan key:generate --force

    - name: Run Laravel package discovery
      run: php artisan package:discover --ansi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM dependencies and build assets
      run: |
        npm ci
        npm run build

    - name: Validate FTP deployment secrets
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        test -n "$FTP_HOST" || { echo "FTP_HOST secret is missing"; exit 1; }
        test -n "$FTP_USERNAME" || { echo "FTP_USERNAME secret is missing"; exit 1; }
        test -n "$FTP_PASSWORD" || { echo "FTP_PASSWORD secret is missing"; exit 1; }

    - name: Sync files to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        server-dir: ./
        security: strict
        timeout: 120000
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          .env
          .env.*
          **/.env
          **/.env.*
          **/node_modules/**
          **/tests/**
          **/.github/**
          storage/**
