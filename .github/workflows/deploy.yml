name: FTP Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
        coverage: none

    # ==========================================
    # ایجاد پوشه‌های کش (برای جلوگیری از خطای Valid Cache Path)
    # ==========================================
    - name: Create required cache directories
      run: |
        mkdir -p bootstrap/cache
        mkdir -p storage/framework/views
        mkdir -p storage/framework/cache
        mkdir -p storage/framework/sessions
        chmod -R 775 bootstrap/cache
        chmod -R 775 storage/framework

    # ==========================================
    # مرحله 1: نصب وابستگی‌های Composer
    # ==========================================
    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader --no-scripts

    - name: Run Laravel package discovery
      run: php artisan package:discover --ansi || true

    # ==========================================
    # مرحله 2: ایجاد فایل .env و تولید کلید
    # ==========================================
    - name: Create .env file and generate key
      run: |
        echo "APP_ENV=production" >> .env
        echo "APP_DEBUG=false" >> .env
        echo "APP_KEY=" >> .env
        echo "DB_CONNECTION=mysql" >> .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "DB_PORT=3306" >> .env
        echo "DB_DATABASE=dummy" >> .env
        echo "DB_USERNAME=dummy" >> .env
        echo "DB_PASSWORD=dummy" >> .env
        php artisan key:generate --force

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install NPM dependencies and build assets
      run: |
        npm ci
        npm run build

    - name: Sync files to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ secrets.FTP_TARGET_DIR }}/
        exclude: |
          **/.git*
          **/node_modules/**
          **/tests/**
          **/vendor/**
          **/.github/**
          storage/