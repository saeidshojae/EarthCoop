name: FTP Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: false

jobs:
  najm-hoda-tests:
    name: Najm Hoda Safety Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
        coverage: none

    - name: Create required cache directories
      run: |
        mkdir -p bootstrap/cache
        mkdir -p storage/framework/views
        mkdir -p storage/framework/cache
        mkdir -p storage/framework/sessions
        chmod -R 775 bootstrap/cache
        chmod -R 775 storage/framework

    - name: Remove tracked legacy vendor tree
      run: rm -rf vendor

    - name: Install Composer dependencies for tests
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Create test environment
      run: |
        cat > .env <<'EOF'
        APP_NAME=EarthCoop
        APP_ENV=testing
        APP_KEY=
        APP_DEBUG=true
        APP_URL=http://localhost
        LOG_CHANNEL=stack
        DB_CONNECTION=mysql
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_DATABASE=newearthcoop-test
        DB_USERNAME=root
        DB_PASSWORD=
        CACHE_DRIVER=array
        SESSION_DRIVER=array
        QUEUE_CONNECTION=sync
        MAIL_MAILER=array
        BROADCAST_DRIVER=log
        FILESYSTEM_DISK=local
        NAJM_HODA_MOCK_MODE=true
        EOF
        php artisan key:generate --force

    - name: Validate Composer configuration
      run: composer validate --no-check-publish

    - name: Enforce Composer security advisory gate
      run: composer audit --no-dev --abandoned=report

    - name: Run database migrations
      run: php artisan migrate --force

    - name: Run user import boundary tests
      run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/UserImport

    - name: Run Najm Hoda regression tests
      run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/NajmHoda

  najm-hoda-readiness:
    name: Najm Hoda Strict Production Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
        coverage: none

    - name: Prepare Laravel directories
      run: |
        mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions
        chmod -R 775 bootstrap/cache storage/framework

    - name: Remove tracked legacy vendor tree
      run: rm -rf vendor

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Create readiness environment
      run: |
        cat > .env <<'EOF'
        APP_NAME=EarthCoop
        APP_ENV=testing
        APP_KEY=
        APP_DEBUG=true
        APP_URL=http://localhost
        LOG_CHANNEL=stack
        DB_CONNECTION=mysql
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_DATABASE=newearthcoop
        DB_USERNAME=root
        DB_PASSWORD=
        CACHE_DRIVER=file
        SESSION_DRIVER=array
        QUEUE_CONNECTION=sync
        MAIL_MAILER=array
        BROADCAST_DRIVER=log
        FILESYSTEM_DISK=local
        NAJM_HODA_ENABLED=true
        NAJM_HODA_MOCK_MODE=true
        NAJM_HODA_RUNTIME_EVENT_BUS_DRIVER=database
        EOF
        php artisan key:generate --force
        php artisan cache:clear

    - name: Run migrations
      run: php artisan migrate --force

    - name: Run controlled GameDay cycle one
      run: php artisan najm-hoda:gameday --dry-run

    - name: Run controlled GameDay cycle two
      run: php artisan najm-hoda:gameday --dry-run

    - name: Capture readiness report
      run: php artisan najm-hoda:production-readiness --window=24 --json || true

    - name: Enforce strict production readiness gate
      run: php artisan najm-hoda:production-readiness --window=24 --strict

  ftp-deploy:
    name: Deploy via FTP
    needs: [najm-hoda-tests, najm-hoda-readiness]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
        coverage: none

    - name: Create required cache directories
      run: |
        mkdir -p bootstrap/cache
        mkdir -p storage/framework/views
        mkdir -p storage/framework/cache
        mkdir -p storage/framework/sessions
        chmod -R 775 bootstrap/cache
        chmod -R 775 storage/framework

    - name: Remove tracked legacy vendor tree
      run: rm -rf vendor

    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

    - name: Create CI environment file
      run: |
        echo "APP_ENV=production" >> .env
        echo "APP_DEBUG=false" >> .env
        echo "APP_KEY=" >> .env
        echo "DB_CONNECTION=mysql" >> .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "DB_PORT=3306" >> .env
        echo "DB_DATABASE=dummy" >> .env
        echo "DB_USERNAME=dummy" >> .env
        echo "DB_PASSWORD=dummy" >> .env
        php artisan key:generate --force

    - name: Run Laravel package discovery
      run: php artisan package:discover --ansi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM dependencies and build assets
      run: |
        npm ci
        npm run build
        test -f public/build/manifest.json
        grep -F 'resources/js/app.js' public/build/manifest.json >/dev/null

    - name: Validate FTP deployment secrets
      env:
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        test -n "$FTP_USERNAME" || { echo "FTP_USERNAME secret is missing"; exit 1; }
        test -n "$FTP_PASSWORD" || { echo "FTP_PASSWORD secret is missing"; exit 1; }

    - name: Sync files to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: cp59.mihanvps.com
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        server-dir: ./
        security: strict
        timeout: 300000
        log-level: minimal
        state-name: .ftp-deploy-sync-state.json
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          .env
          .env.*
          **/.env
          **/.env.*
          **/node_modules/**
          **/vendor/**
          **/tests/**
          **/.github/**
          storage/**