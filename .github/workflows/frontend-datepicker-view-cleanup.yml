name: Frontend Datepicker View Cleanup

on:
  push:
    branches:
      - agent/frontend-runtime-security
    paths:
      - .github/workflows/frontend-datepicker-view-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-runtime-security
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - run: npm ci

      - name: Replace CDN profile assets and remove unused registration assets
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path('resources/views/profile/edit.blade.php')
          s = profile.read_text()
          replacements = {
              'https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css': '{{ asset("vendor/persian-datepicker/persian-datepicker.min.css") }}',
              'https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js': '{{ asset("vendor/persian-datepicker/persian-datepicker.min.js") }}',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Profile expected asset not found: {old}')
              s = s.replace(old, new)
          profile.write_text(s)

          register = Path('resources/views/auth/register_step1.blade.php')
          r = register.read_text()
          obsolete = [
              '    <!-- Persian Datepicker -->\n',
              '    <script src="{{ asset("vendor/jquery/jquery.min.js") }}"></script>\n',
              '    <script src="{{ asset("vendor/persian-date/persian-date.min.js") }}"></script>\n',
              '    <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>\n',
              '    <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">\n',
          ]
          for old in obsolete:
              if old not in r:
                  raise SystemExit(f'Registration expected obsolete asset not found: {old.strip()}')
              r = r.replace(old, '', 1)
          register.write_text(r)
          PY

      - name: Validate view asset cleanup
        run: |
          ! grep -RIn 'unpkg.com/persian-datepicker' resources/views/profile/edit.blade.php resources/views/auth/register_step1.blade.php
          grep -F 'asset("vendor/persian-datepicker/persian-datepicker.min.css")' resources/views/profile/edit.blade.php
          grep -F 'asset("vendor/persian-datepicker/persian-datepicker.min.js")' resources/views/profile/edit.blade.php
          ! grep -F 'vendor/persian-date/persian-date.min.js' resources/views/auth/register_step1.blade.php
          ! grep -F 'vendor/jquery/jquery.min.js' resources/views/auth/register_step1.blade.php

      - name: Build and audit
        run: |
          npm run build
          npm audit --omit=dev --audit-level=low

      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/profile/edit.blade.php resources/views/auth/register_step1.blade.php
          git commit -m 'frontend: use tracked Persian datepicker assets'
          git push origin HEAD:agent/frontend-runtime-security
