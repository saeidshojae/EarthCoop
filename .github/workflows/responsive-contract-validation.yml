name: EarthCoop Responsive Contract Validation

on:
  pull_request:
    branches:
      - agent/pre-main-ui-polish
      - main
    paths:
      - 'public/Css/responsive-system.css'
      - 'resources/views/layouts/unified.blade.php'
      - 'resources/views/groups/**'
      - 'tests/js/responsive/**'
      - 'docs/superpowers/specs/2026-08-28-responsive-system-and-my-groups-mobile-design.md'
      - 'docs/superpowers/plans/2026-08-28-responsive-system-my-groups-implementation.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate responsive contract
        run: node --test tests/js/responsive/my-groups-mobile-contract.test.js
