name: Vendor Package Targeted Gate

on:
  push:
    branches:
      - agent/ftp-vendor-package-deployment-implementation-20261001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none
      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
      - name: Install dependencies
        run: |
          rm -rf vendor
          composer install --prefer-dist --no-interaction --no-progress
      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_testing
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          FILESYSTEM_DISK=local
          EOF
          php artisan key:generate --force
          php artisan migrate --force
      - name: Vendor package targeted gate
        run: |
          php artisan test \
            tests/Unit/Deployment/VendorPackageInstallerTest.php \
            tests/Unit/Deployment/VendorPackageInstallerRollbackTest.php \
            tests/Architecture/DeploymentVendorPackageBoundaryTest.php \
            tests/Unit/Deployment/DeploymentConsoleServiceTest.php \
            tests/Feature/Admin/DeploymentConsoleSourceContractTest.php \
            tests/Feature/Admin/DeploymentConsoleSecurityTest.php \
            tests/Feature/Admin/DeploymentConsoleExecutionTest.php \
            tests/Feature/Admin/DeploymentVendorPackageConsoleTest.php

  package-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none
      - name: Build and audit production dependency tree
        run: |
          rm -rf vendor
          composer validate --no-check-publish
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts
          composer audit --no-dev --abandoned=report
      - name: Build and verify vendor package exactly like production workflow
        shell: bash
        env:
          SOURCE_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOCK_SHA="$(sha256sum composer.lock | awk '{print $1}')"
          PACKAGE_DIR=".deployment/vendor-package"
          PACKAGE_NAME="vendor-${LOCK_SHA}.zip"
          PACKAGE_PATH="${PACKAGE_DIR}/${PACKAGE_NAME}"
          mkdir -p "$PACKAGE_DIR"
          zip -qr "$PACKAGE_PATH" vendor
          PACKAGE_SHA="$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"
          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PHP_VERSION="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
          export LOCK_SHA PACKAGE_NAME PACKAGE_SHA CREATED_AT PHP_VERSION SOURCE_GIT_SHA
          php -r '$manifest=["schema_version"=>1,"package_filename"=>getenv("PACKAGE_NAME"),"package_sha256"=>getenv("PACKAGE_SHA"),"composer_lock_sha256"=>getenv("LOCK_SHA"),"source_git_sha"=>getenv("SOURCE_GIT_SHA"),"created_at"=>getenv("CREATED_AT"),"expected_top_level"=>"vendor","php_version"=>getenv("PHP_VERSION")]; file_put_contents(".deployment/vendor-package/manifest.json", json_encode($manifest, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR));'
          test -s "$PACKAGE_PATH"
          test -s "$PACKAGE_DIR/manifest.json"
          MANIFEST_LOCK="$(php -r '$m=json_decode(file_get_contents(".deployment/vendor-package/manifest.json"),true,512,JSON_THROW_ON_ERROR); echo $m["composer_lock_sha256"];')"
          MANIFEST_PACKAGE_SHA="$(php -r '$m=json_decode(file_get_contents(".deployment/vendor-package/manifest.json"),true,512,JSON_THROW_ON_ERROR); echo $m["package_sha256"];')"
          test "$LOCK_SHA" = "$MANIFEST_LOCK"
          test "$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')" = "$MANIFEST_PACKAGE_SHA"
          unzip -l "$PACKAGE_PATH" | grep -F 'vendor/autoload.php' >/dev/null
