name: Mobile Offline Focused Verification
on:
  push:
    branches: [agent/mobile-offline-verification-20261004]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/features/notifications/notification_read_offline_test.dart test/core/offline/offline_replay_engine_test.dart test/core/offline/scoped_offline_queue_test.dart test/features/notifications/notification_sync_service_test.dart test/features/notifications/notification_account_storage_test.dart
