name: M6 Google Auth Materialize

on:
  push:
    branches:
      - agent/flutter-native-client-foundation-20260929
    paths:
      - '.github/workflows/m6-google-auth-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Materialize google/auth dependency
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          composer require 'google/auth:^1.55' --no-interaction --no-scripts --with-all-dependencies
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-scripts
          git diff -- composer.json composer.lock
          git diff --exit-code -- . ':!composer.json' ':!composer.lock'
      - name: Commit dependency lock
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.json composer.lock; then
            echo 'google/auth already materialized'
            exit 0
          fi
          git config user.name 'earthcoop-m6-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add composer.json composer.lock
          git commit -m 'build(push): add Google Auth dependency'
          git pull --rebase origin agent/flutter-native-client-foundation-20260929
          git push origin HEAD:agent/flutter-native-client-foundation-20260929
