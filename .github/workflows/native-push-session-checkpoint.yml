name: Native push session checkpoint
on:
  push:
    branches: [agent/native-push-session-verification-20261004]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android UAT signing
        shell: bash
        env:
          ANDROID_UAT_KEYSTORE_BASE64: ${{ secrets.ANDROID_UAT_KEYSTORE_BASE64 }}
          ANDROID_UAT_KEY_ALIAS: ${{ secrets.ANDROID_UAT_KEY_ALIAS }}
          ANDROID_UAT_STORE_PASSWORD: ${{ secrets.ANDROID_UAT_STORE_PASSWORD }}
          ANDROID_UAT_KEY_PASSWORD: ${{ secrets.ANDROID_UAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          configured=0
          test -n "$ANDROID_UAT_KEYSTORE_BASE64" && configured=$((configured + 1))
          test -n "$ANDROID_UAT_KEY_ALIAS" && configured=$((configured + 1))
          test -n "$ANDROID_UAT_STORE_PASSWORD" && configured=$((configured + 1))
          test -n "$ANDROID_UAT_KEY_PASSWORD" && configured=$((configured + 1))

          if [ "$configured" -ne 4 ]; then
            echo "::error::Published UAT APKs require all four stable UAT signing secrets."
            exit 1
          fi

          UAT_KEYSTORE_PATH="$RUNNER_TEMP/earthcoop-uat.jks"
          printf '%s' "$ANDROID_UAT_KEYSTORE_BASE64" | base64 --decode > "$UAT_KEYSTORE_PATH"
          test -s "$UAT_KEYSTORE_PATH" || { echo "::error::Decoded UAT keystore is empty"; exit 1; }

          {
            echo "EARTHCOOP_UAT_KEYSTORE_PATH=$UAT_KEYSTORE_PATH"
            echo "EARTHCOOP_UAT_KEY_ALIAS=$ANDROID_UAT_KEY_ALIAS"
            echo "EARTHCOOP_UAT_STORE_PASSWORD=$ANDROID_UAT_STORE_PASSWORD"
            echo "EARTHCOOP_UAT_KEY_PASSWORD=$ANDROID_UAT_KEY_PASSWORD"
            echo "EARTHCOOP_UAT_SIGNING_MODE=stable-uat"
          } >> "$GITHUB_ENV"

      - name: Android stable UAT compile
        run: flutter build apk --debug
        working-directory: apps/mobile
      - name: Retain signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: earthcoop-android-uat-1.0.0+7-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
