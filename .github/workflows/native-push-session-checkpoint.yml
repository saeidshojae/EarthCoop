name: Native push session checkpoint
on:
  push:
    branches: [agent/native-push-session-verification-20261004]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter test test/core/push/push_registration_service_test.dart
        working-directory: apps/mobile
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
