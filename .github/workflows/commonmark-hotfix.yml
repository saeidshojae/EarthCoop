name: CommonMark Security Hotfix

on:
  push:
    branches: [ hotfix/commonmark-security-20260908 ]

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/commonmark-security-20260908
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Update only CommonMark to secure compatible release
        run: composer update league/commonmark --with-dependencies --no-interaction --no-progress

      - name: Verify resolved CommonMark version
        run: composer show league/commonmark

      - name: Enforce production dependency security audit
        run: composer audit --no-dev --abandoned=report

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Commit generated lockfile only
        run: |
          git status --short
          test -z "$(git status --short -- composer.json)"
          git diff --exit-code -- . ':!.github/workflows/commonmark-hotfix.yml' ':!composer.lock' || true
          git config user.name "earthcoop-ci"
          git config user.email "actions@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "No lockfile change produced" >&2
            exit 1
          fi
          git commit -m "fix: update CommonMark past security advisories"
          git push origin HEAD:hotfix/commonmark-security-20260908
