name: EarthCoop Secretariat S2 Validation

on:
  push:
    branches:
      - agent/secretariat-s2-documents-relations-acl-ui
  pull_request:
    branches:
      - agent/secretariat-s1-registry-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthcoop-secretariat-s2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretariat-s2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs

      - name: Install backend dependencies
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress

      - name: Create isolated test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_testing
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_ENABLED=true
          NAJM_HODA_MOCK_MODE=true
          NAJM_HODA_RUNTIME_EVENT_BUS_DRIVER=database
          EOF
          php artisan key:generate --force

      - name: PHP syntax gate for Secretariat S1/S2
        run: |
          find app/Modules/Secretariat tests/Feature/Secretariat tests/Support -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find database/migrations -maxdepth 1 -type f \( -name '2026_08_18_2000*.php' -o -name '2026_08_18_2100*.php' \) -print0 | xargs -0 -n1 php -l

      - name: Fresh migration
        run: php artisan migrate:fresh --force

      - name: Verify S2 rollback and re-apply
        run: |
          php artisan migrate:rollback --step=3 --force
          php artisan migrate --force

      - name: Run all Secretariat S1/S2 feature tests
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Secretariat

      - name: Re-prove S1 registry numbering concurrency
        shell: bash
        run: |
          set -euo pipefail
          workers=12
          rounds=3

          for round in $(seq 1 "$rounds"); do
            echo "=== S2 regression concurrency round $round/$rounds ==="
            php tests/Support/SecretariatConcurrencyProbe.php setup

            pids=()
            for i in $(seq 1 "$workers"); do
              php tests/Support/SecretariatConcurrencyProbe.php worker "$i" > "/tmp/secretariat-s2-round-$round-worker-$i.log" 2>&1 &
              pids+=("$!")
            done

            php tests/Support/SecretariatConcurrencyProbe.php release

            status=0
            for index in "${!pids[@]}"; do
              worker=$((index + 1))
              if ! wait "${pids[$index]}"; then
                echo "=== round $round worker $worker failed ==="
                cat "/tmp/secretariat-s2-round-$round-worker-$worker.log"
                status=1
              fi
            done

            if [ "$status" -ne 0 ]; then
              cat /tmp/secretariat-s2-round-$round-worker-*.log || true
              exit "$status"
            fi

            php tests/Support/SecretariatConcurrencyProbe.php verify "$workers"
          done

      - name: Run group authorization regressions
        run: |
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/GroupChat/MessageAuthorizationTest.php
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Admin/GroupRoleManagementTest.php
