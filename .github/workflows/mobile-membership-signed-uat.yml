name: Mobile membership signed UAT +18

on:
  workflow_dispatch:
  push:
    branches:
      - agent/flutter-native-client-foundation-20260929
    paths:
      - '.github/workflows/mobile-membership-signed-uat.yml'

permissions:
  contents: read

concurrency:
  group: mobile-membership-signed-uat-18
  cancel-in-progress: true

jobs:
  build-signed-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17f6521c84508b6c7038757a88377135233b66df

      - name: Require +18 source
        run: |
          set -euo pipefail
          test "$(awk '/^version:/ {print $2; exit}' apps/mobile/pubspec.yaml)" = "1.0.0+18"

      - name: Prepare stable Android UAT signing
        shell: bash
        env:
          ANDROID_UAT_KEYSTORE_BASE64: ${{ secrets.ANDROID_UAT_KEYSTORE_BASE64 }}
          ANDROID_UAT_KEY_ALIAS: ${{ secrets.ANDROID_UAT_KEY_ALIAS }}
          ANDROID_UAT_STORE_PASSWORD: ${{ secrets.ANDROID_UAT_STORE_PASSWORD }}
          ANDROID_UAT_KEY_PASSWORD: ${{ secrets.ANDROID_UAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          test -n "$ANDROID_UAT_KEYSTORE_BASE64" && configured=$((configured + 1))
          test -n "$ANDROID_UAT_KEY_ALIAS" && configured=$((configured + 1))
          test -n "$ANDROID_UAT_STORE_PASSWORD" && configured=$((configured + 1))
          test -n "$ANDROID_UAT_KEY_PASSWORD" && configured=$((configured + 1))
          test "$configured" -eq 4 || { echo "::error::All stable UAT signing secrets are required."; exit 1; }

          UAT_KEYSTORE_PATH="$RUNNER_TEMP/earthcoop-uat.jks"
          printf '%s' "$ANDROID_UAT_KEYSTORE_BASE64" | base64 --decode > "$UAT_KEYSTORE_PATH"
          test -s "$UAT_KEYSTORE_PATH"

          {
            echo "EARTHCOOP_UAT_KEYSTORE_PATH=$UAT_KEYSTORE_PATH"
            echo "EARTHCOOP_UAT_KEY_ALIAS=$ANDROID_UAT_KEY_ALIAS"
            echo "EARTHCOOP_UAT_STORE_PASSWORD=$ANDROID_UAT_STORE_PASSWORD"
            echo "EARTHCOOP_UAT_KEY_PASSWORD=$ANDROID_UAT_KEY_PASSWORD"
            echo "EARTHCOOP_UAT_SIGNING_MODE=stable-uat"
          } >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Materialize required Firebase Android configuration
        env:
          EARTHCOOP_FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.EARTHCOOP_FIREBASE_ANDROID_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$EARTHCOOP_FIREBASE_ANDROID_JSON_BASE64" || { echo "::error::Firebase Android configuration is required for +18."; exit 1; }
          python scripts/mobile/firebase_configuration.py \
            --output "$RUNNER_TEMP/firebase-defines.json" \
            --android-resources apps/mobile/android/app/src/main/res/values/earthcoop_firebase.xml
          echo 'EARTHCOOP_FCM_CONFIGURED=true' >> "$GITHUB_ENV"

      - name: Build exact Android UAT release
        working-directory: apps/mobile
        run: EARTHCOOP_RELEASE_CHANNEL=uat flutter build apk --release --dart-define-from-file="$RUNNER_TEMP/firebase-defines.json"

      - name: Verify package, version, signature, non-debuggable and Internet
        run: bash scripts/mobile/verify_android_uat_release.sh apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Stage immutable +18 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-uat-18
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk mobile-uat-18/earthcoop-android-uat-1.0.0+18.apk
          cp "$RUNNER_TEMP/earthcoop-apk-certificate.txt" mobile-uat-18/certificate.txt
          cp "$RUNNER_TEMP/earthcoop-apk-badging.txt" mobile-uat-18/badging.txt

          APK="mobile-uat-18/earthcoop-android-uat-1.0.0+18.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_SIZE_BYTES="$(stat -c%s "$APK")"
          CERT_SHA256="$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' mobile-uat-18/certificate.txt)"
          EXPECTED_CERT_SHA256="eda5c77121b0bbf1c08b82fb61e59f55a7ea61a2fe0fbbb23537d5bc134c8543"
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::Stable UAT certificate continuity failed."
            exit 1
          }
          BUILT_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > mobile-uat-18/build.json <<EOF
          {
            "channel": "uat",
            "platform": "android",
            "build_type": "release",
            "version": "1.0.0+18",
            "git_sha": "17f6521c84508b6c7038757a88377135233b66df",
            "workflow_sha": "${GITHUB_SHA}",
            "fcm_configured": true,
            "signing_mode": "stable-uat",
            "certificate_sha256": "${CERT_SHA256}",
            "apk_sha256": "${APK_SHA256}",
            "apk_size_bytes": ${APK_SIZE_BYTES},
            "built_at_utc": "${BUILT_AT_UTC}",
            "host_published": false
          }
          EOF

          test -s "$APK"
          test -s mobile-uat-18/build.json
          grep -F '"version": "1.0.0+18"' mobile-uat-18/build.json >/dev/null
          grep -F '"fcm_configured": true' mobile-uat-18/build.json >/dev/null
          grep -F '"signing_mode": "stable-uat"' mobile-uat-18/build.json >/dev/null
          grep -F '"host_published": false' mobile-uat-18/build.json >/dev/null
          sha256sum "$APK" > mobile-uat-18/apk.sha256

      - name: Retain exact signed +18 candidate
        uses: actions/upload-artifact@v4
        with:
          name: earthcoop-android-uat-18-17f6521c84508b6c7038757a88377135233b66df
          path: mobile-uat-18/
          if-no-files-found: error
          retention-days: 30
