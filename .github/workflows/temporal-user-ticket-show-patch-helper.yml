name: Temporal user ticket show one-shot patch helper

on:
  push:
    branches:
      - agent/temporal-user-ticket-show-patch-helper-20261005
    paths:
      - .github/workflows/temporal-user-ticket-show-patch-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/temporal-user-ticket-show-patch-helper-20261005
          fetch-depth: 0

      - name: Apply exact two one-shot patches
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/views/user/tickets/show.blade.php')
          data = path.read_bytes()

          replacements = [
              (b"{{ \\Morilog\\Jalali\\Jalalian::fromCarbon($ticket->created_at)->format('Y/m/d H:i') }}", b'<x-temporal.date-time :value="$ticket->created_at" />'),
              (b"{{ \\Morilog\\Jalali\\Jalalian::fromCarbon($comment->created_at)->format('Y/m/d H:i') }}", b'<x-temporal.date-time :value="$comment->created_at" />'),
          ]

          for old, new in replacements:
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence for {old!r}, found {count}')
              data = data.replace(old, new)

          path.write_bytes(data)

      - name: Verify and commit only intended patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporal-user-ticket-show-patch-helper.yml

          changed="$(git diff --name-only HEAD | sort)"
          expected=$'.github/workflows/temporal-user-ticket-show-patch-helper.yml\nresources/views/user/tickets/show.blade.php'
          test "$changed" = "$expected"

          test "$(grep -F -c '<x-temporal.date-time :value="$ticket->created_at" />' resources/views/user/tickets/show.blade.php)" -eq 1
          test "$(grep -F -c '<x-temporal.date-time :value="$comment->created_at" />' resources/views/user/tickets/show.blade.php)" -eq 1
          test "$(grep -F -c 'Jalalian::' resources/views/user/tickets/show.blade.php || true)" -eq 0
          test "$(grep -F -c 'Morilog\\Jalali' resources/views/user/tickets/show.blade.php || true)" -eq 0

          git config user.name 'earthcoop-temporal-helper'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(temporal): use shared datetime component in user ticket detail'
          git push origin HEAD:agent/temporal-user-ticket-show-patch-helper-20261005
