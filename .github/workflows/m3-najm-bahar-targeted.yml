name: M3 Najm Bahar Targeted Gate

on:
  push:
    branches:
      - agent/m3-najm-bahar-mobile-contract-20260927
    paths:
      - 'app/Modules/NajmBahar/**'
      - 'app/Http/Controllers/API/V1/NajmBahar*'
      - 'app/Http/Controllers/ReputationConversionController.php'
      - 'app/Http/Controllers/NajmBaharMembershipFeeController.php'
      - 'app/Http/Resources/API/V1/NajmBahar*'
      - 'app/Services/ParticipationPointSummaryService.php'
      - 'app/Services/MembershipFeeStatusService.php'
      - 'routes/api-v1.php'
      - 'tests/Feature/Api/V1/NajmBahar*'
      - 'tests/Feature/NajmBahar/**'
      - 'tests/Feature/Reputation/**'
      - 'tests/Feature/TransactionServiceTest.php'
      - 'tests/Unit/NajmBahar/**'
      - 'tests/Architecture/NajmBaharFinancialMutationBoundaryTest.php'
      - '.github/workflows/m3-najm-bahar-targeted.yml'

permissions:
  contents: read

concurrency:
  group: m3-najm-bahar-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bahar-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_mysql
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          php artisan migrate:fresh --force
      - name: Run M3 account and balance contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmBaharAccountContractTest.php tests/Feature/NajmBahar/AccountBalanceServiceTest.php tests/Feature/NajmBahar/AccountInvariantServiceTest.php
      - name: Run M3 transaction history and transfer contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmBaharTransactionContractTest.php tests/Feature/TransactionServiceTest.php
      - name: Run mature transfer safety regressions
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/NajmBahar/SafeTransactionServiceInvariantTest.php tests/Feature/NajmBahar/SafeTransactionBindingTest.php tests/Feature/NajmBahar/GenericSubAccountFallbackRetirementTest.php tests/Feature/NajmBahar/DimTransferRestrictionTest.php tests/Feature/NajmBahar/ActiveBaharReservationServiceTest.php tests/Feature/NajmBahar/TransactionReservationProtectionTest.php tests/Feature/NajmBahar/FinancialIdempotencyReplayServiceTest.php
      - name: Run M3 policy-backed activation contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmBaharActivationContractTest.php tests/Feature/NajmBahar/MonetaryServiceTest.php tests/Feature/Reputation/ParticipationConversionLedgerContractTest.php tests/Feature/Reputation/ParticipationConversionAtomicIdentityTest.php tests/Feature/Reputation/ParticipationSummaryBoundaryContractTest.php tests/Feature/Reputation/ParticipationConversionUiIdempotencyContractTest.php tests/Feature/Reputation/ParticipationConversionInfoTransparencyContractTest.php
      - name: Run M3 membership fee contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmBaharMembershipFeeContractTest.php tests/Feature/NajmBahar/MembershipFeePaymentTest.php tests/Feature/NajmBahar/MembershipFeePolicyIntegrityTest.php tests/Feature/NajmBahar/TreasuryServiceTest.php
