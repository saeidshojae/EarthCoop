name: FCM readiness checkpoint
on:
  push:
    branches: [agent/fcm-readiness-20261005]
permissions:
  contents: read
jobs:
  transport-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          mysql --host=127.0.0.1 --port=3306 --user=root -e 'CREATE DATABASE IF NOT EXISTS `newearthcoop-test` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
      - name: Normalize changed PHP and report exact patch
        run: |
          vendor/bin/pint app/Services/Push/FcmReadinessCheck.php app/Services/Push/FcmAccessTokenProvider.php app/Console/Commands/FcmReadiness.php app/Services/Deployment/DeploymentConsoleService.php routes/deployment-console.php tests/Unit/Services/Push/FcmReadinessCheckTest.php tests/Unit/Services/Push/FcmAccessTokenProviderTest.php tests/Feature/Admin/DeploymentFcmReadinessTest.php tests/Unit/Deployment/DeploymentConsoleServiceTest.php
          git diff --no-ext-diff
      - name: Provider and deployment-console regression
        run: |
          composer validate --no-check-publish
          composer audit --no-dev --abandoned=report
          php artisan migrate:fresh --force
          vendor/bin/phpunit -c phpunit.xml.dist tests/Unit/Services/Push tests/Unit/Push tests/Unit/Deployment tests/Architecture/DeploymentVendorPackageBoundaryTest.php tests/Feature/Admin/DeploymentConsoleSecurityTest.php tests/Feature/Admin/DeploymentConsoleExecutionTest.php tests/Feature/Admin/DeploymentConsoleSourceContractTest.php tests/Feature/Admin/DeploymentVendorPackageConsoleTest.php tests/Feature/Admin/DeploymentConsoleOptimizeClearTest.php tests/Feature/Admin/DeploymentFcmReadinessTest.php tests/Feature/Api/V1/PushProviderFailureIsolationTest.php tests/Feature/Api/V1/DevicePushContractTest.php tests/Feature/Api/V1/DevicePushReleaseTest.php
