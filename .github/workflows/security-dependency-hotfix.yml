name: Security Dependency Hotfix

on:
  push:
    branches:
      - agent/security-dependency-hotfix-20261001
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-dependency-hotfix-20261001
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          rm -rf vendor
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_test
          DB_USERNAME=root
          DB_PASSWORD=
          NAJM_HODA_MOCK_MODE=true
          EOF
      - name: Update only vulnerable dependency set
        run: |
          composer update laravel/framework league/commonmark league/flysystem phpseclib/phpseclib --with-all-dependencies --no-interaction --no-progress
          php artisan key:generate --force
      - name: Prove security audit is green
        run: composer audit --no-dev --abandoned=report
      - name: Verify migrations and focused regressions
        run: |
          php artisan migrate:fresh --force
          vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Communication
          vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Auth
          vendor/bin/phpunit -c phpunit.xml.dist tests/Architecture/CommunicationDeliveryBoundaryTest.php
          vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/NajmHoda/FounderEmailManagementConnectivityTest.php
      - name: Record resolved package versions
        run: |
          composer show laravel/framework league/commonmark league/flysystem phpseclib/phpseclib || true
      - name: Commit regenerated lock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock did not change"
            exit 1
          fi
          git commit -m "fix(security): update vulnerable Composer dependencies"
          git push origin HEAD:agent/security-dependency-hotfix-20261001
