name: Apply integration regression fixes

on:
  push:
    branches:
      - agent/integration-hoda-bahar-after-groups

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted integration fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EarthCoop Integration Bot"
          git config user.email "integration@earthcoop.invalid"

          python3 - <<'PY'
          from pathlib import Path

          # Governance snapshots must never include non-human/system identities.
          p = Path('app/Modules/Governance/Services/EligibilitySnapshotService.php')
          s = p.read_text()
          old = """            DB::table('group_user')
                ->select(['user_id'])
                ->where('group_id', $group->id)
                ->where('status', 1)
                ->whereNull('deleted_at')
                ->chunkById($chunkSize, function ($rows) use ($snapshot, &$hash, &$eligibleCount, &$chunkIndex) {
"""
          new = """            DB::table('group_user')
                ->join('users', 'users.id', '=', 'group_user.user_id')
                ->select(['group_user.user_id as user_id'])
                ->where('group_user.group_id', $group->id)
                ->where('group_user.status', 1)
                ->whereNull('group_user.deleted_at')
                ->where('users.is_system', false)
                ->chunkById($chunkSize, function ($rows) use ($snapshot, &$hash, &$eligibleCount, &$chunkIndex) {
"""
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace("                }, 'user_id', 'user_id');", "                }, 'group_user.user_id', 'user_id');", 1)
              s = s.replace("                'deleted_at' => null,\n                'captured_from' => 'group_user',", "                'deleted_at' => null,\n                'system_identity' => false,\n                'captured_from' => 'group_user+users',", 1)
              p.write_text(s)
          elif "->where('users.is_system', false)" not in s:
              raise SystemExit('EligibilitySnapshotService patch anchor not found')

          # Project type is economic/functional type; visibility is public/private.
          p = Path('database/factories/Modules/NajmBahar/Models/ProjectFactory.php')
          s = p.read_text()
          old = "            'project_type' => $this->faker->randomElement(['public', 'private']),\n"
          new = "            'project_type' => $this->faker->randomElement(['production', 'service', 'infrastructure', 'research', 'social']),\n            'project_visibility' => $this->faker->randomElement(['public', 'private']),\n"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif "'project_visibility' => $this->faker->randomElement(['public', 'private'])" not in s:
              raise SystemExit('ProjectFactory patch anchor not found')

          p = Path('app/Modules/NajmBahar/Models/Project.php')
          s = p.read_text()
          s2 = s.replace("return $query->where('project_type', 'public');", "return $query->where('project_visibility', 'public');", 1)
          s2 = s2.replace("return $query->where('project_type', 'private');", "return $query->where('project_visibility', 'private');", 1)
          if s2 != s:
              p.write_text(s2)
          elif "where('project_visibility', 'public')" not in s or "where('project_visibility', 'private')" not in s:
              raise SystemExit('Project visibility scope patch anchors not found')

          # Use the repository's actual JavaScript test script.
          p = Path('.github/workflows/integration-full-validation.yml')
          s = p.read_text()
          old = "          npm test -- --runInBand || status=1\n"
          new = "          npm run test:group-chat || status=1\n"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif "npm run test:group-chat || status=1" not in s:
              raise SystemExit('JS validation patch anchor not found')
          PY

          if git diff --quiet; then
            echo "Regression fixes already applied."
            exit 0
          fi

          git add app/Modules/Governance/Services/EligibilitySnapshotService.php \
            database/factories/Modules/NajmBahar/Models/ProjectFactory.php \
            app/Modules/NajmBahar/Models/Project.php \
            .github/workflows/integration-full-validation.yml
          git commit -m "Fix integration governance and project regressions"
          git push origin HEAD:agent/integration-hoda-bahar-after-groups
