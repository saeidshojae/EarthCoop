name: Restore ProjectService test safely

on:
  push:
    branches:
      - agent/integration-hoda-bahar-after-groups

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integration-hoda-bahar-after-groups
          fetch-depth: 0

      - name: Restore full test and patch only approved-project fixture
        shell: bash
        run: |
          set -euo pipefail
          git show f1cebfae76b9d84d78cbc6ff459f25b60e42e747:tests/Unit/NajmBahar/ProjectServiceTest.php > tests/Unit/NajmBahar/ProjectServiceTest.php
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/Unit/NajmBahar/ProjectServiceTest.php')
          s = p.read_text(encoding='utf-8')
          marker = '    public function it_can_get_approved_projects()\n'
          pos = s.index(marker)
          head, tail = s[:pos], s[pos:]
          old = """            'profit_percentage' => 15,\n            'project_type' => 'production',\n            'project_visibility' => 'public',\n"""
          new = """            'profit_percentage' => 15,\n            'project_type' => 'production',\n            'project_visibility' => 'public',\n            'project_stage' => 'active',\n            'investment_method' => 'capital_participation',\n            'problem_statement' => 'شرح مسئله پروژه تایید شده',\n            'solution_description' => 'راه‌حل پروژه تایید شده',\n            'target_market' => 'general',\n            'accept_transparency' => true,\n            'accept_rules' => true,\n"""
          if old not in tail:
              raise SystemExit('Approved-project fixture anchor not found')
          tail = tail.replace(old, new, 1)
          p.write_text(head + tail, encoding='utf-8')
          PY

      - name: Commit restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Unit/NajmBahar/ProjectServiceTest.php
          git commit -m "Restore full ProjectService regression coverage"
          git push origin HEAD:agent/integration-hoda-bahar-after-groups
