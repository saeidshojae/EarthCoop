name: Mobile Main Lock Reconcile

on:
  push:
    branches:
      - agent/mobile-main-lock-reconcile-20261003
    paths:
      - '.github/workflows/mobile-main-lock-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Reconcile google auth onto current main lock
        run: composer update google/auth --with-all-dependencies --no-install --no-scripts --no-interaction --no-progress
      - name: Reconcile RouteServiceProvider additions from main and mobile
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/Providers/RouteServiceProvider.php')
          source = path.read_text()
          needle = "->group(base_path('routes/web.php'));"
          block = """

            // Communication Center observability stays isolated from the legacy
            // email CRUD surface and remains administrator-only.
            Route::middleware(['web', \\App\\Http\\Middleware\\AdminMiddleware::class])
                ->prefix('admin/communications')
                ->name('admin.communications.')
                ->group(base_path('routes/communication-center.php'));
          """
          if "routes/communication-center.php" not in source:
              position = source.find(needle)
              if position < 0:
                  raise SystemExit('routes/web.php marker not found')
              insert_at = position + len(needle)
              source = source[:insert_at] + block + source[insert_at:]
              path.write_text(source)
      - name: Validate reconciled files
        run: |
          composer validate --no-check-publish
          php -l app/Providers/RouteServiceProvider.php
      - name: Commit only clean conflict resolutions
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mobile-main-lock-reconcile.yml
          git add composer.lock app/Providers/RouteServiceProvider.php
          git diff --cached --check
          git commit -m 'chore(mobile): reconcile current main conflicts'
          git push origin "HEAD:${BRANCH_NAME}"
