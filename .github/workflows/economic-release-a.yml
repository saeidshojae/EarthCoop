name: Economic Release A CI

on:
  push:
    branches:
      - agent/economic-system-release-a
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: economic-release-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-core:
    name: Najm Bahar Constitutional Core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs

      - name: Remove tracked legacy vendor tree
        run: rm -rf vendor

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite assets
        run: npm run build

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_MOCK_MODE=true
          EOF
          php artisan key:generate --force

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Release A constitutional gate
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist \
            tests/Unit/NajmBahar/NajmBaharConstitutionTest.php \
            tests/Feature/NajmBahar/AccountBalanceServiceTest.php \
            tests/Feature/NajmBahar/AccountInvariantServiceTest.php \
            tests/Feature/NajmBahar/BalanceNormalizationServiceTest.php \
            tests/Feature/NajmBahar/DimTransferRestrictionTest.php \
            tests/Feature/NajmBahar/HistoricalLedgerBackfillTest.php \
            tests/Feature/NajmBahar/IdleCapitalObservationServiceTest.php \
            tests/Feature/NajmBahar/InitialMembershipCreditTest.php \
            tests/Feature/NajmBahar/InternalAccountTransferServiceTest.php \
            tests/Feature/NajmBahar/InvestmentVisibilityTest.php \
            tests/Feature/NajmBahar/MembershipFeePaymentTest.php \
            tests/Feature/NajmBahar/MembershipRetirementServiceTest.php \
            tests/Feature/NajmBahar/MonetaryPolicyServiceTest.php \
            tests/Feature/NajmBahar/MonetaryServiceTest.php \
            tests/Feature/NajmBahar/OperationalCommandsTest.php \
            tests/Feature/NajmBahar/RetirementLiabilitySettlementServiceTest.php \
            tests/Feature/NajmBahar/SafeSubAccountBindingTest.php \
            tests/Feature/NajmBahar/SafeTransactionBindingTest.php \
            tests/Feature/NajmBahar/TreasuryServiceTest.php \
            2>&1 | tee storage/logs/release-a-core.txt

      - name: Upload Release A core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-a-core-output
          path: storage/logs/release-a-core.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Run financial architecture guards
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Architecture/NajmBaharFinancialMutationBoundaryTest.php 2>&1 | tee storage/logs/release-a-architecture.txt

      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-a-architecture-output
          path: storage/logs/release-a-architecture.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Run legacy project and investment regression inventory
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist \
            tests/Feature/NajmBahar/ProjectControllerTest.php \
            tests/Feature/NajmBahar/InvestmentControllerTest.php \
            tests/Unit/NajmBahar/ProjectServiceTest.php \
            tests/Unit/NajmBahar/InvestmentServiceTest.php \
            2>&1 | tee storage/logs/release-a-legacy-inventory.txt

      - name: Upload legacy regression inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-a-legacy-regression-output
          path: storage/logs/release-a-legacy-inventory.txt
          if-no-files-found: ignore
          retention-days: 7
