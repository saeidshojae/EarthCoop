name: M6 Flutter Task 8 TDD

on:
  push:
    branches:
      - agent/flutter-native-client-foundation-20260929
    paths:
      - 'apps/mobile/lib/core/offline/**'
      - 'apps/mobile/lib/core/local/app_database.dart'
      - 'apps/mobile/lib/features/notifications/notification_repository.dart'
      - 'apps/mobile/test/core/offline/**'
      - 'apps/mobile/test/features/notifications/notification_read_offline_test.dart'
      - '.github/workflows/m6-flutter-task8.yml'

permissions:
  contents: read

jobs:
  offline-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check formatting
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          scopes=(test/core/offline test/features/notifications/notification_read_offline_test.dart)
          [ ! -d lib/core/offline ] || scopes+=(lib/core/offline)
          scopes+=(lib/core/local/app_database.dart lib/features/notifications/notification_repository.dart)
          dart format "${scopes[@]}"
          git diff -- "${scopes[@]}"
          git diff --exit-code -- "${scopes[@]}"
      - name: Analyze offline scope
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          scopes=(test/core/offline test/features/notifications/notification_read_offline_test.dart)
          [ ! -d lib/core/offline ] || scopes+=(lib/core/offline)
          scopes+=(lib/core/local/app_database.dart lib/features/notifications/notification_repository.dart)
          flutter analyze "${scopes[@]}"
      - name: Run Task 8 offline replay contracts
        working-directory: apps/mobile
        run: flutter test test/core/offline test/features/notifications/notification_read_offline_test.dart
