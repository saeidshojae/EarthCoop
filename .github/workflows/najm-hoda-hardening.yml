name: Najm Hoda Hardening CI

on:
  push:
    branches:
      - agent/najm-hoda-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: najm-hoda-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Najm Hoda Hardening Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Create required cache directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          chmod -R 775 bootstrap/cache
          chmod -R 775 storage/framework

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_MOCK_MODE=true
          EOF
          php artisan key:generate --force

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Report Composer security status
        continue-on-error: true
        run: composer audit --no-dev

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run user import boundary tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/UserImport

      - name: Run Najm Hoda regression tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/NajmHoda
