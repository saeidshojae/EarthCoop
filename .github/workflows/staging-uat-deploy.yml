name: Staging UAT Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type STAGING-UAT to confirm this is not a production deployment'
        required: true
        type: string
      server_dir:
        description: 'Exact cPanel FTP directory for the staging subdomain, including trailing slash'
        required: true
        type: string
      app_url:
        description: 'Staging URL used only for build/readiness context (example: https://new.earthcoop.info)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-uat-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate staging boundary
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless explicit staging boundary is present
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SERVER_DIR: ${{ inputs.server_dir }}
          APP_URL: ${{ inputs.app_url }}
          REQUESTED_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          test "$REQUESTED_REF" = "agent/najm-hoda-executive-uat-post-elections" || {
            echo "Refusing deploy: workflow must run from the dedicated executive UAT branch"
            exit 1
          }

          test "$CONFIRMATION" = "STAGING-UAT" || {
            echo "Refusing deploy: confirmation must equal STAGING-UAT"
            exit 1
          }

          test -n "$SERVER_DIR" || {
            echo "Refusing deploy: server_dir is required"
            exit 1
          }

          test -n "$APP_URL" || {
            echo "Refusing deploy: app_url is required"
            exit 1
          }

          case "$SERVER_DIR" in
            */) ;;
            *)
              echo "Refusing deploy: server_dir must end with /"
              exit 1
              ;;
          esac

          case "$SERVER_DIR" in
            /*|~*|*\\*|*../*|*/../*|*/..|..|./../*)
              echo "Refusing deploy: absolute, home-relative, backslash, or traversal server_dir is not allowed"
              exit 1
              ;;
          esac

          NORMALIZED_SERVER_DIR="$SERVER_DIR"
          while [ "${NORMALIZED_SERVER_DIR#./}" != "$NORMALIZED_SERVER_DIR" ]; do
            NORMALIZED_SERVER_DIR="${NORMALIZED_SERVER_DIR#./}"
          done
          NORMALIZED_SERVER_DIR="${NORMALIZED_SERVER_DIR%/}"

          case "$NORMALIZED_SERVER_DIR" in
            ""|.|public_html)
              echo "Refusing deploy: production/root-like server_dir is not allowed"
              exit 1
              ;;
          esac

          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          value = os.environ['APP_URL'].strip()
          try:
              parsed = urlsplit(value)
          except Exception as exc:
              print(f"Refusing deploy: invalid APP_URL ({exc})")
              sys.exit(1)

          host = (parsed.hostname or '').lower().rstrip('.')
          if parsed.scheme != 'https':
              print('Refusing deploy: APP_URL must use https')
              sys.exit(1)
          if parsed.username or parsed.password:
              print('Refusing deploy: APP_URL must not contain credentials')
              sys.exit(1)
          if parsed.query or parsed.fragment:
              print('Refusing deploy: APP_URL must not contain query or fragment')
              sys.exit(1)
          if parsed.path not in ('', '/'):
              print('Refusing deploy: APP_URL must be the staging origin, without an application path')
              sys.exit(1)
          if host in {'earthcoop.info', 'www.earthcoop.info'}:
              print('Refusing deploy: production APP_URL is not allowed')
              sys.exit(1)
          if not host.endswith('.earthcoop.info'):
              print('Refusing deploy: APP_URL must be a dedicated earthcoop.info subdomain')
              sys.exit(1)
          if parsed.port not in (None, 443):
              print('Refusing deploy: staging HTTPS origin must use the default HTTPS port')
              sys.exit(1)
          PY

  full-validation:
    name: Staging UAT safety gate
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-uat
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout requested UAT ref
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions
          chmod -R 775 bootstrap/cache storage/framework

      - name: Remove tracked legacy vendor tree
        run: rm -rf vendor

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Create isolated UAT validation environment
        env:
          STAGING_APP_URL: ${{ inputs.app_url }}
        run: |
          cat > .env <<EOF
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=${STAGING_APP_URL}
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-uat
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_ENABLED=true
          NAJM_HODA_MOCK_MODE=true
          NAJM_HODA_RUNTIME_EVENT_BUS_DRIVER=database
          EOF
          php artisan key:generate --force

      - name: Migrate integrated schemas
        run: php artisan migrate --force

      - name: Validate route and command boot
        run: |
          php artisan route:list > /tmp/route-list.txt
          php artisan list > /tmp/artisan-list.txt
          grep -q "admin.najm-hoda.founder-ops.ministry.chat" /tmp/route-list.txt
          grep -q "admin.najm-hoda.founder-ops.ministry.readiness" /tmp/route-list.txt

      - name: Run Najm Hoda founder ministry tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/NajmHoda/FounderMinistryChatServiceTest.php

      - name: Run Najm Hoda regression tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/NajmHoda

  deploy-staging:
    name: Deploy UAT ref to staging via FTPS
    needs: full-validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging-uat
    steps:
      - name: Checkout requested UAT ref
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Remove tracked legacy vendor tree
        run: rm -rf vendor

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

      - name: Build production assets
        run: |
          npm ci
          npm run build

      - name: Validate dedicated staging secrets
        env:
          FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" || { echo "STAGING_FTP_SERVER secret is missing"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "STAGING_FTP_USERNAME secret is missing"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "STAGING_FTP_PASSWORD secret is missing"; exit 1; }

      - name: Sync files to staging only
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ inputs.server_dir }}
          security: strict
          timeout: 300000
          log-level: minimal
          state-name: .ftp-deploy-uat-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/.github/**
            storage/**
