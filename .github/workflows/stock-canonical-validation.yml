name: Stock Canonical Activation Validation

on:
  push:
    branches:
      - agent/stock-canonical-cutover-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-canonical-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-stock-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Stock canonical branch
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs

      - name: Install backend dependencies
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress

      - name: Create isolated test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_testing
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          STOCK_SECONDARY_MARKET_ENABLED=false
          STOCK_EXTERNAL_CAPITAL_ENABLED=false
          EOF
          php artisan key:generate --force
          mysql --host=127.0.0.1 --port=3306 --user=root -e 'CREATE DATABASE IF NOT EXISTS `newearthcoop-test` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'

      - name: Validate migrations
        run: |
          php artisan migrate --force
          DB_DATABASE=newearthcoop-test php artisan migrate:fresh --force

      - name: Validate canonical routes and commands
        run: |
          php artisan route:list > /tmp/routes.txt
          grep -F 'stock.secondary-listing' /tmp/routes.txt >/dev/null
          grep -F 'auction.canonical-bid' /tmp/routes.txt >/dev/null
          php artisan list > /tmp/commands.txt
          grep -F 'stock:canonical-readiness' /tmp/commands.txt >/dev/null

      - name: Run Stock canonical tests
        run: |
          php vendor/bin/phpunit --configuration phpunit.xml.dist \
            --log-junit storage/logs/stock-canonical-junit.xml \
            tests/Feature/Stock tests/Unit/Stock

      - name: Upload Stock PHPUnit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-canonical-phpunit-${{ github.run_id }}
          path: storage/logs/stock-canonical-junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Run readiness release gate
        run: |
          php artisan stock:canonical-readiness --fail-on-blocker
