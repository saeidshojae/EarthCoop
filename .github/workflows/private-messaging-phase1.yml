name: Private Messaging Phase 1 Validation

on:
  push:
    branches:
      - agent/private-messaging-professionalization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-messaging-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs regression-logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs

      - name: Install backend dependencies
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Create isolated test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_testing
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_ENABLED=true
          NAJM_HODA_MOCK_MODE=true
          EOF
          php artisan key:generate --force

      - name: Provision databases
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root -e 'CREATE DATABASE IF NOT EXISTS `newearthcoop-test` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          php artisan migrate --force
          DB_DATABASE=newearthcoop-test php artisan migrate --force

      - name: Validate routes boot
        run: |
          php artisan route:list > /tmp/routes.txt
          grep -F 'private-chats' /tmp/routes.txt >/dev/null
          grep -F 'chat-requests' /tmp/routes.txt >/dev/null

      - name: Private messaging targeted tests
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist \
            tests/Feature/PrivateMessagingReadStateTest.php \
            tests/Feature/PrivateMessagingUiContractTest.php \
            tests/Feature/ChatRequestFlowTest.php 2>&1 | tee regression-logs/private-messaging.log

      - name: Upload private messaging diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: private-messaging-phase1-diagnostics
          path: regression-logs/private-messaging.log
          if-no-files-found: warn
          retention-days: 7
