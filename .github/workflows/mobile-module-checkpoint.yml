name: Mobile module checkpoint
on:
  push:
    branches: [agent/mobile-module-expansion-20261005]
permissions:
  contents: read
concurrency:
  group: mobile-module-checkpoint
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Run module tests
        run: flutter test test/features/najm_bahar
        working-directory: apps/mobile
