name: Temporary bounded auto-fixer temporal patch

on:
  push:
    branches:
      - agent/temporal-system-20261001

permissions:
  contents: write

jobs:
  patch-auto-fixer:
    if: "github.event.head_commit.message == 'chore(ci): stage bounded auto-fixer temporal patch'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply bounded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/admin/najm-hoda/auto-fixer-settings.blade.php')
          data = path.read_bytes()
          before_cr = data.count(b'\r')
          before_lf = data.count(b'\n')

          old = b"new Date(data.stats.oldest_backup).toLocaleDateString('fa-IR')"
          new = b"data.stats.oldest_backup_label"

          count = data.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy formatter, got {count}')

          data = data.replace(old, new, 1)

          if b"toLocaleDateString('fa-IR'" in data:
              raise SystemExit('legacy fa-IR formatter remains')
          if data.count(b'\r') != before_cr or data.count(b'\n') != before_lf:
              raise SystemExit('line-ending counts changed')

          path.write_bytes(data)
          PY

          changed="$(git diff --name-only)"
          test "$changed" = "resources/views/admin/najm-hoda/auto-fixer-settings.blade.php"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/admin/najm-hoda/auto-fixer-settings.blade.php
          git commit -m "fix(temporal): unify auto-fixer backup date presentation"
          git push origin HEAD:agent/temporal-system-20261001
