name: Temporary current-main merge diagnostic

on:
  push:
    branches:
      - agent/temporal-system-20261001

permissions:
  contents: read

jobs:
  diagnose:
    if: "github.event.head_commit.message == 'chore(ci): diagnose current main merge'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff 20f4cf0b6599db3381819aa3dc85367d468f48a7
          merge_status=$?
          set -e
          echo "MERGE_STATUS=$merge_status"
          echo "UNMERGED_BEGIN"
          git diff --name-only --diff-filter=U
          echo "UNMERGED_END"
          git merge --abort || true
