name: Temporal System Targeted Gate

on:
  push:
    branches:
      - agent/temporal-system-20261001
    paths:
      - 'app/Temporal/**'
      - 'app/Chronicle/**'
      - 'app/Http/Controllers/ChronicleController.php'
      - 'app/Providers/ChronicleServiceProvider.php'
      - 'app/View/Components/Temporal/**'
      - 'config/temporal.php'
      - 'lang/*/chronicle.php'
      - 'resources/js/temporal-input.js'
      - 'resources/views/chronicle/**'
      - 'resources/views/components/temporal/**'
      - 'tests/Unit/Temporal/**'
      - 'tests/Unit/Chronicle/**'
      - 'tests/Feature/Temporal/**'
      - 'tests/Feature/Chronicle/**'
      - 'tests/js/temporal/**'
      - 'package.json'
      - '.github/workflows/temporal-system-targeted.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/Temporal/**'
      - 'app/Chronicle/**'
      - 'app/Http/Controllers/ChronicleController.php'
      - 'app/Providers/ChronicleServiceProvider.php'
      - 'app/View/Components/Temporal/**'
      - 'config/temporal.php'
      - 'lang/*/chronicle.php'
      - 'resources/js/temporal-input.js'
      - 'resources/views/chronicle/**'
      - 'resources/views/components/temporal/**'
      - 'tests/Unit/Temporal/**'
      - 'tests/Unit/Chronicle/**'
      - 'tests/Feature/Temporal/**'
      - 'tests/Feature/Chronicle/**'
      - 'tests/js/temporal/**'
      - 'package.json'
      - '.github/workflows/temporal-system-targeted.yml'
  workflow_dispatch:

jobs:
  temporal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund
          php artisan key:generate

      - name: Run Temporal and Chronicle unit tests
        shell: bash
        run: |
          php artisan test tests/Unit/Temporal
          if [ -d tests/Unit/Chronicle ]; then
            php artisan test tests/Unit/Chronicle
          fi

      - name: Run Temporal and Chronicle feature tests when present
        shell: bash
        run: |
          if [ -d tests/Feature/Temporal ]; then
            php artisan test tests/Feature/Temporal
          fi
          if [ -d tests/Feature/Chronicle ]; then
            php artisan test tests/Feature/Chronicle
          fi

      - name: Run Temporal frontend tests
        run: npm run test:temporal
