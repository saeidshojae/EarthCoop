name: Temporary guarded main merge

on:
  push:
    branches:
      - agent/temporal-system-20261001

permissions:
  contents: write

jobs:
  merge-main:
    if: "github.event.head_commit.message == 'chore(ci): stage guarded main merge'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main with guarded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          expected_main="20f4cf0b6599db3381819aa3dc85367d468f48a7"
          test "$actual_main" = "$expected_main"

          set +e
          git merge --no-ff --no-commit "$expected_main"
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            echo "Expected the known TicketSlaService conflict, but merge was conflict-free."
            exit 1
          fi

          unmerged="$(git diff --name-only --diff-filter=U)"
          test "$unmerged" = "app/Services/TicketSlaService.php"

          git checkout --ours app/Services/TicketSlaService.php
          git add app/Services/TicketSlaService.php

          test -z "$(git diff --name-only --diff-filter=U)"

          if grep -q "Morilog\\\\Jalali" app/Services/TicketSlaService.php; then
            echo "Legacy Jalali dependency leaked into TicketSlaService."
            exit 1
          fi

          git commit -m "Merge main into temporal branch for final validation"
          git push origin HEAD:agent/temporal-system-20261001
