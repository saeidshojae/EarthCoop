name: Temporal System Targeted Gate

on:
  push:
    branches:
      - agent/temporal-system-20261001
    paths:
      - '.github/workflows/temporal-system-targeted.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temporal-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded category temporal patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/admin/system-settings/categories/index.blade.php')
          data = path.read_bytes()

          old = "{{ $category->created_at ? verta($category->created_at)->format('Y/n/j') : '—' }}".encode()
          new = '@if($category->created_at)<x-temporal.date :value="$category->created_at" style="short" />@else—@endif'.encode()

          assert data.count(old) == 1, f'expected exactly one legacy expression, got {data.count(old)}'
          assert data.count(new) == 0, 'new temporal expression already exists'

          before_cr = data.count(b'\r')
          before_lf = data.count(b'\n')
          patched = data.replace(old, new, 1)

          assert patched.count(old) == 0
          assert patched.count(new) == 1
          assert patched.count(b'\r') == before_cr
          assert patched.count(b'\n') == before_lf

          path.write_bytes(patched)
          PY

          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "resources/views/admin/system-settings/categories/index.blade.php"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/admin/system-settings/categories/index.blade.php
          git commit -m "fix(temporal): unify system settings category dates"
          git push
