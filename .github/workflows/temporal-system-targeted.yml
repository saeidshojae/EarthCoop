name: Temporary main merge diagnostic

on:
  push:
    branches:
      - agent/temporal-system-20261001

permissions:
  contents: read

jobs:
  diagnose:
    if: "github.event.head_commit.message == 'chore(ci): diagnose main merge conflicts'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose merge
        shell: bash
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff cfb921b1b3f843438bec5222aaa75eaaf81f9977
          merge_status=$?
          set -e
          echo "MERGE_STATUS=$merge_status"
          echo "UNMERGED_BEGIN"
          git diff --name-only --diff-filter=U
          echo "UNMERGED_END"
          echo "STATUS_BEGIN"
          git status --short
          echo "STATUS_END"
          git merge --abort || true
