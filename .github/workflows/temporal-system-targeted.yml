name: Temporal System Targeted Gate

on:
  push:
    branches:
      - agent/temporal-system-20261001
    paths:
      - '.github/workflows/temporal-system-targeted.yml'

permissions:
  contents: write

jobs:
  temporal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded admin content temporal patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('resources/views/admin/content/index.blade.php')
          data = path.read_bytes()
          before = data
          before_cr = data.count(b'\r')
          before_lf = data.count(b'\n')

          variables = [b'announcement', b'page', b'rule']
          legacy = b"echo $date ? \\Morilog\\Jalali\\Jalalian::fromCarbon($date)->format('Y/m/d') : '-';"
          replacement = b"$date = $date ?: null;"

          for variable in variables:
              assignment = (
                  b"$date = isset($" + variable + b"->created_at) ? "
                  b"\\Carbon\\Carbon::parse($" + variable + b"->created_at) : null;"
              )
              pattern = re.compile(
                  rb"(@php)(\s+)(try \{)(\s+)(" + re.escape(assignment) + rb")"
                  rb"(\s+)(" + re.escape(legacy) + rb")"
                  rb"(\s+)(\} catch \(\\Exception \$e\) \{)"
                  rb"(\s+)(echo '-';)(\s+)(\})(\s+)(@endphp)"
              )
              matches = list(pattern.finditer(data))
              if len(matches) != 1:
                  raise SystemExit(f"{variable.decode()} block count={len(matches)}")

              def repl(match):
                  return (
                      match.group(1) + match.group(2) + match.group(3) + match.group(4)
                      + match.group(5) + match.group(6) + replacement
                      + match.group(8) + match.group(9) + match.group(10)
                      + b"$date = null;" + match.group(12) + match.group(13)
                      + match.group(14) + match.group(15)
                      + b' @if($date) <x-temporal.date :value="$date" /> @else - @endif'
                  )

              data = pattern.sub(repl, data, count=1)

          if data == before:
              raise SystemExit('patch made no changes')
          if data.count(b'<x-temporal.date :value="$date" />') != 3:
              raise SystemExit('temporal component count mismatch')
          if b'Morilog\\Jalali' in data or b'Jalalian::' in data:
              raise SystemExit('legacy Jalali presentation remains')
          if data.count(b'\r') != before_cr or data.count(b'\n') != before_lf:
              raise SystemExit('line-ending counts changed')

          path.write_bytes(data)
          PY

          changed="$(git diff --name-only)"
          test "$changed" = "resources/views/admin/content/index.blade.php"
          git diff --stat
          git diff -- resources/views/admin/content/index.blade.php

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/admin/content/index.blade.php
          git commit -m "fix(temporal): unify admin content dates"
          git push origin HEAD:agent/temporal-system-20261001
