name: Temporal System Targeted Gate

on:
  push:
    branches:
      - agent/temporal-system-20261001
    paths:
      - '.github/workflows/temporal-system-targeted.yml'

permissions:
  contents: write

jobs:
  temporal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded admin faq temporal patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/admin/faq/index.blade.php')
          data = path.read_bytes()
          before = data
          before_cr = data.count(b'\r')
          before_lf = data.count(b'\n')

          replacements = [
              (
                  b"{{ \\Morilog\\Jalali\\Jalalian::fromCarbon($createdAt)->format('Y/m/d') }}",
                  b'<x-temporal.date :value="$createdAt" />',
              ),
              (
                  b"{{ \\Morilog\\Jalali\\Jalalian::fromCarbon($createdAt)->format('H:i') }}",
                  b'<x-temporal.time :value="$createdAt" />',
              ),
              (
                  b"{{ \\Morilog\\Jalali\\Jalalian::fromCarbon($answeredAt)->format('Y/m/d') }}",
                  b'<x-temporal.date :value="$answeredAt" />',
              ),
              (
                  b"const notifiedDate = new Date(question.notified_at).toLocaleDateString('fa-IR');",
                  b"const notifiedDate = question.notified_at_display || '---';",
              ),
          ]

          for old, new in replacements:
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"target count mismatch: {old!r} count={count}")
              data = data.replace(old, new, 1)

          if data == before:
              raise SystemExit('patch made no changes')
          if data.count(b'<x-temporal.date :value="$createdAt" />') != 1:
              raise SystemExit('created date component mismatch')
          if data.count(b'<x-temporal.time :value="$createdAt" />') != 1:
              raise SystemExit('created time component mismatch')
          if data.count(b'<x-temporal.date :value="$answeredAt" />') != 1:
              raise SystemExit('answered date component mismatch')
          if b'question.notified_at_display' not in data:
              raise SystemExit('notified display contract missing')
          if b'Morilog\\Jalali' in data or b'Jalalian::' in data:
              raise SystemExit('legacy Jalali presentation remains')
          if b"toLocaleDateString('fa-IR'" in data or b'toLocaleDateString("fa-IR"' in data:
              raise SystemExit('fixed fa-IR browser formatting remains')
          if data.count(b'\r') != before_cr or data.count(b'\n') != before_lf:
              raise SystemExit('line-ending counts changed')

          path.write_bytes(data)
          PY

          changed="$(git diff --name-only)"
          test "$changed" = "resources/views/admin/faq/index.blade.php"
          git diff --stat
          git diff -- resources/views/admin/faq/index.blade.php

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/admin/faq/index.blade.php
          git commit -m "fix(temporal): unify admin faq date presentation"
          git push origin HEAD:agent/temporal-system-20261001
