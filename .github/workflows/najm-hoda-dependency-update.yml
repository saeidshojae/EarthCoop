name: Najm Hoda Dependency Update

on:
  push:
    branches:
      - agent/najm-hoda-hardening

permissions:
  contents: write

concurrency:
  group: najm-hoda-dependency-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-guzzle:
    if: contains(github.event.head_commit.message, '[resolve-guzzle]')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/najm-hoda-hardening
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Create required cache directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache storage/framework/sessions
          chmod -R 775 bootstrap/cache storage/framework

      - name: Resolve Guzzle security updates with Composer
        run: |
          composer update guzzlehttp/guzzle guzzlehttp/psr7 --with-all-dependencies --no-interaction --no-progress --no-scripts
          composer show guzzlehttp/guzzle
          composer show guzzlehttp/psr7
          composer audit --no-dev || true

      - name: Commit Composer-generated lockfile
        run: |
          if git diff --quiet -- composer.lock composer.json; then
            echo "Composer produced no dependency changes."
            exit 0
          fi

          git config user.name "najm-hoda-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add composer.lock composer.json
          git commit -m "security: update Guzzle dependency line"
          git push origin HEAD:agent/najm-hoda-hardening
