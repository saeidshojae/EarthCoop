name: Najm Hoda n8n Integration CI

on:
  push:
    branches:
      - agent/najm-hoda-n8n-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: najm-hoda-n8n-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions
          chmod -R 775 bootstrap/cache storage/framework

      - name: Remove tracked legacy vendor tree
        run: rm -rf vendor

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_MOCK_MODE=true
          NAJM_HODA_N8N_ENABLED=false
          EOF
          php artisan key:generate --force

      - name: Validate Composer security posture
        run: |
          composer validate --no-check-publish
          composer audit --no-dev --abandoned=report

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run n8n gateway tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/NajmHoda/N8nGatewayTest.php

      - name: Run Najm Hoda regression tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/NajmHoda

      - name: Guard milestone-1 autonomy boundary
        run: |
          ! grep -R "'apply' =>\|=> 'apply'" config/najm-hoda-n8n.php
          grep -F "NAJM_HODA_N8N_ENABLED', false" config/najm-hoda-n8n.php
          grep -F "hash_hmac('sha256'" app/Services/NajmHoda/Integrations/N8n/N8nGateway.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
