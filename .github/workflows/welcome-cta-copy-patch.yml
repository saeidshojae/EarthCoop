name: Welcome CTA Copy Patch

on:
  push:
    branches:
      - agent/welcome-community-stories

permissions:
  contents: write

jobs:
  patch-welcome:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/welcome-community-stories
          fetch-depth: 0
      - name: Apply corrective Welcome CTA patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Shared .welcome-cta contract owns the responsive sizing.
          for raw, token in {
              'resources/views/partials/projects-section.blade.php': 'px-10 py-5 ',
              'resources/views/partials/how-it-works-section.blade.php': 'px-10 py-5 ',
              'resources/views/partials/invite-section.blade.php': 'px-12 py-5 ',
          }.items():
              path = Path(raw)
              text = path.read_text().replace(token, '')
              path.write_text(text)

          # Public Welcome projects CTA starts registration.
          projects_path = Path('resources/views/partials/projects-section.blade.php')
          projects = projects_path.read_text()
          projects = projects.replace(
              '<a href="{{ route(\'najm-bahar.investments.index\') }}" class="welcome-cta ',
              '<button type="button" onclick="openModal()" aria-controls="registrationModal" class="welcome-cta ',
              1,
          )
          marker = "{{ __('langWelcome.projects_cta') }}"
          idx = projects.find(marker)
          if idx < 0:
              raise SystemExit('Projects CTA marker missing')
          close_idx = projects.find('</a>', idx)
          if close_idx >= 0:
              projects = projects[:close_idx] + '</button>' + projects[close_idx + 4:]
          projects_path.write_text(projects)

          # Copy follows that registration action.
          locale_values = {
              'fa': 'برای مشارکت بپیوندید',
              'en': 'Join to participate',
              'ar': 'انضم للمشاركة',
          }
          for locale, value in locale_values.items():
              path = Path(f'resources/lang/{locale}/langWelcome.php')
              text = path.read_text()
              pattern = r"(^\s*'projects_cta'\s*=>\s*)'[^']*'(\s*,)"
              if not re.search(pattern, text, flags=re.M):
                  raise SystemExit(f'projects_cta missing for {locale}')
              text = re.sub(pattern, lambda m: m.group(1) + "'" + value + "'" + m.group(2), text, count=1, flags=re.M)
              path.write_text(text)

          # Resolve the current invite credit rule from the canonical regulation service.
          invite_path = Path('resources/views/partials/invite-section.blade.php')
          invite = invite_path.read_text()
          if 'inviteRewardRule' not in invite:
              anchor = '<!-- Invite & Earn Bahār Section'
              pos = invite.find(anchor)
              if pos < 0:
                  raise SystemExit('Invite section anchor missing')
              line_end = invite.find('\n', pos)
              injection = "\n@php\n    $inviteRewardRule = collect(app(\\App\\Services\\ParticipationCreditRegulationService::class)->snapshot()['actionRules'] ?? [])->firstWhere('key', 'invite_member');\n@endphp\n"
              invite = invite[:line_end + 1] + injection + invite[line_end + 1:]
          invite_path.write_text(invite)
          PY
      - name: Commit corrected Welcome surfaces
        run: |
          if git diff --quiet; then
            echo "Corrective Welcome patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/partials/projects-section.blade.php resources/views/partials/how-it-works-section.blade.php resources/views/partials/invite-section.blade.php resources/lang/fa/langWelcome.php resources/lang/en/langWelcome.php resources/lang/ar/langWelcome.php
          git commit -m "fix: restore Welcome CTA and participation credit contracts"
          git push origin HEAD:agent/welcome-community-stories
