name: Welcome CTA Copy Patch

on:
  push:
    branches:
      - agent/welcome-community-stories

permissions:
  contents: write

jobs:
  patch-welcome:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/welcome-community-stories
          fetch-depth: 0
      - name: Apply Welcome CTA and invitation corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('resources/css/app.css')
          css = css_path.read_text()
          if '.welcome-cta {' not in css:
              css += '''\n\n/* Shared responsive contract for primary Welcome actions. */\n.welcome-cta {\n  min-width: 0;\n  min-height: 48px;\n  max-width: 100%;\n  border-radius: 9999px;\n  white-space: normal;\n  overflow-wrap: anywhere;\n  line-height: 1.45;\n  text-align: center;\n}\n'''
              css_path.write_text(css)

          partials = [
              'resources/views/partials/hero-section.blade.php',
              'resources/views/partials/how-it-works-section.blade.php',
              'resources/views/partials/cta-section.blade.php',
          ]
          for raw in partials:
              path = Path(raw)
              text = path.read_text()
              # Opt all CTA-shaped buttons/anchors into the shared sizing contract.
              text = re.sub(r'class="(?![^"]*\bwelcome-cta\b)([^"]*(?:rounded-full|welcome-wide-cta__button)[^"]*)"', r'class="welcome-cta \1"', text)
              path.write_text(text)

          projects_path = Path('resources/views/partials/projects-section.blade.php')
          projects = projects_path.read_text()
          old = '''<button type="button" onclick="openModal()" aria-controls="registrationModal" class="bg-earth-green text-pure-white px-10 py-5 rounded-full shadow-lg hover:bg-dark-green transition duration-300 font-vazirmatn text-xl font-bold transform hover:scale-105 flex items-center justify-center mx-auto">'''
          new = '''<a href="{{ route('najm-bahar.investments.index') }}" class="welcome-cta bg-earth-green text-pure-white px-10 py-5 rounded-full shadow-lg hover:bg-dark-green transition duration-300 font-vazirmatn text-xl font-bold transform hover:scale-105 flex items-center justify-center mx-auto">'''
          if old in projects:
              projects = projects.replace(old, new, 1)
              projects = projects.replace('</button>', '</a>', 1)
          elif "onclick=\"openModal()\"" in projects:
              raise SystemExit('Projects CTA shape changed; refusing unsafe patch')
          projects = re.sub(r'class="(?![^"]*\bwelcome-cta\b)([^"]*rounded-full[^"]*)"', r'class="welcome-cta \1"', projects)
          projects_path.write_text(projects)

          invite_path = Path('resources/views/partials/invite-section.blade.php')
          invite = invite_path.read_text()
          invite = invite.replace('href="#bahar"', 'href="{{ route(\'participation.credit-regulation\') }}"', 1)
          invite = invite.replace("{{ __('langWelcome.invite_btn_learn') }}", "{{ __('langWelcome.invite_reward_label') }}", 1)
          invite = re.sub(r'class="(?![^"]*\bwelcome-cta\b)([^"]*(?:rounded-full|welcome-wide-cta__button)[^"]*)"', r'class="welcome-cta \1"', invite)
          invite_path.write_text(invite)

          replacements = {
              'fa': {
                  'invite_title': 'EarthCoop را گسترش دهید و اعتبار مشارکت دریافت کنید',
                  'invite_text': 'با دعوت موفق دوستان به EarthCoop، مطابق نظام‌نامه اعتبارات مشارکت، اعتبار مشارکت دریافت می‌کنید. شرایط و میزان اعتبار بر اساس قواعد جاری سامانه اعمال می‌شود.',
                  'invite_reward_label': 'اعتبار مشارکت',
                  'invite_btn_learn': 'نظام‌نامه اعتبارات مشارکت',
              },
              'en': {
                  'invite_title': 'Grow EarthCoop and earn participation credit',
                  'invite_text': 'Successful invitations can earn participation credit under the Participation Credit Regulation. Eligibility and credit amounts follow the current system rules.',
                  'invite_reward_label': 'Participation credit',
                  'invite_btn_learn': 'Participation Credit Regulation',
              },
              'ar': {
                  'invite_title': 'وسّع EarthCoop واحصل على رصيد المشاركة',
                  'invite_text': 'يمكن للدعوات الناجحة أن تمنحك رصيد مشاركة وفق نظام رصيد المشاركة. تُطبّق الأهلية ومقدار الرصيد بحسب القواعد السارية في النظام.',
                  'invite_reward_label': 'رصيد المشاركة',
                  'invite_btn_learn': 'نظام رصيد المشاركة',
              },
          }

          for locale, values in replacements.items():
              path = Path(f'resources/lang/{locale}/langWelcome.php')
              text = path.read_text()
              for key, value in values.items():
                  escaped = value.replace('\\', '\\\\').replace("'", "\\'")
                  pattern = rf"(^\s*'{re.escape(key)}'\s*=>\s*)'[^']*(?:\\'[^']*)*'(\s*,)"
                  if re.search(pattern, text, flags=re.M):
                      text = re.sub(pattern, lambda m: m.group(1) + "'" + escaped + "'" + m.group(2), text, count=1, flags=re.M)
                  else:
                      anchor = re.search(r"(^\s*'invite_btn_learn'\s*=>.*$)", text, flags=re.M)
                      if not anchor:
                          raise SystemExit(f'Invite translation anchor missing for {locale}: {key}')
                      line = anchor.group(1)
                      indent = re.match(r'\s*', line).group(0)
                      text = text.replace(line, line + f"\n{indent}'{key}' => '{escaped}',", 1)
              path.write_text(text)
          PY
      - name: Commit patched Welcome surfaces
        run: |
          if git diff --quiet; then
            echo "Welcome CTA/copy patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/css/app.css resources/views/partials/hero-section.blade.php resources/views/partials/how-it-works-section.blade.php resources/views/partials/projects-section.blade.php resources/views/partials/invite-section.blade.php resources/views/partials/cta-section.blade.php resources/lang/fa/langWelcome.php resources/lang/en/langWelcome.php resources/lang/ar/langWelcome.php
          git commit -m "fix: align Welcome CTAs and invitation credit copy"
          git push origin HEAD:agent/welcome-community-stories
