name: Native Bahar activation mobile

on:
  push:
    branches:
      - agent/mobile-bahar-activation-20261007
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-bahar-activation-mobile.yml'

permissions:
  contents: read

concurrency:
  group: native-bahar-activation-mobile
  cancel-in-progress: true

jobs:
  activation-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Normalize activation Dart sources for canonical capture
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          dart format \
            lib/features/najm_bahar/najm_bahar_activation_controller.dart \
            lib/features/najm_bahar/najm_bahar_activation_dto.dart \
            lib/features/najm_bahar/najm_bahar_repository.dart \
            test/features/najm_bahar/najm_bahar_activation_repository_test.dart
          for file in \
            lib/features/najm_bahar/najm_bahar_activation_controller.dart \
            lib/features/najm_bahar/najm_bahar_activation_dto.dart \
            lib/features/najm_bahar/najm_bahar_repository.dart \
            test/features/najm_bahar/najm_bahar_activation_repository_test.dart
          do
            echo "ACTIVATION_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "ACTIVATION_FORMAT_END:$file"
          done
      - name: Activation wire contract
        working-directory: apps/mobile
        run: flutter test --timeout 20s --reporter expanded test/features/najm_bahar/najm_bahar_activation_repository_test.dart
      - name: Activation controller contract
        working-directory: apps/mobile
        run: flutter test --timeout 20s --reporter expanded test/features/najm_bahar/najm_bahar_activation_controller_test.dart
      - name: Activation widget contract
        working-directory: apps/mobile
        run: timeout 180s flutter test --timeout 20s --reporter expanded test/features/najm_bahar/najm_bahar_activation_screen_test.dart
