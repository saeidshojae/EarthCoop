name: Native provider production smoke check
on:
  push:
    branches: [agent/native-provider-production-probe-20261004]
permissions:
  contents: read
jobs:
  public-route:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check anonymous production API boundary
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          failed = False
          for host, path in [('earthcoop.ir', '/api/v1/me'), ('earthcoop.ir', '/api/v1/groups/1/messages/1/attachment'), ('earthcoop.net', '/api/v1/groups/1/messages/1/attachment')]:
              url = 'https://' + host + path
              request = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'EarthCoop-public-route-check'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status, body = response.status, response.read(16384)
              except urllib.error.HTTPError as error:
                  status, body = error.code, error.read(16384)
              except Exception as error:
                  print(host, path, type(error).__name__)
                  if host == 'earthcoop.ir': failed = True
                  continue
              try:
                  document = json.loads(body)
                  code = (document.get('error') or {}).get('code')
                  version = (document.get('meta') or {}).get('api_version')
              except (ValueError, AttributeError):
                  code, version = None, None
              print(json.dumps({'host': host, 'path': path, 'http_status': status, 'error_code': code, 'api_version': version}))
              if host == 'earthcoop.ir' and not (status == 401 and code == 'unauthenticated' and version == 'v1'):
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY
