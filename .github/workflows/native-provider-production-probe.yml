name: Native provider production smoke check
on:
  push:
    branches: [agent/native-provider-production-probe-20261004]
permissions:
  contents: read
jobs:
  public-auth-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify unauthenticated API boundary after deployment
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          endpoints = [
              "https://earthcoop.ir/api/v1/me",
              "https://earthcoop.net/api/v1/me",
              "https://earthcoop.ir/api/v1/groups/1/messages/1/attachment",
          ]
          for url in endpoints:
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              try:
                  response = urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              payload = json.loads(response.read())
              assert response.code == 401, (url, response.code)
              assert payload.get("error_code") == "unauthenticated", (url, payload.get("error_code"))
              print(url, response.code, payload.get("error_code"))
          PY
