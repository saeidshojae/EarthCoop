name: Mobile membership payment
on:
  push:
    branches: [agent/mobile-membership-payment-20261005, agent/mobile-membership-candidate-20261007]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'routes/**'
      - 'composer.*'
      - 'phpunit*'
      - 'apps/mobile/**'
      - '.github/workflows/mobile-membership-payment.yml'
permissions:
  contents: read
concurrency:
  group: mobile-membership-payment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.paths.outputs.php }}
      mobile: ${{ steps.paths.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        run: |
          changed=$(git diff --name-only HEAD^ HEAD)
          if echo "$changed" | grep -Eq '^(app/|tests/|routes/|composer\.|phpunit)'; then echo 'php=true' >> "$GITHUB_OUTPUT"; fi
          if echo "$changed" | grep -q '^apps/mobile/'; then echo 'mobile=true' >> "$GITHUB_OUTPUT"; fi
  bahar-contract:
    needs: changes
    if: needs.changes.outputs.php == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_mysql
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --no-audit --no-fund
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          php artisan migrate:fresh --force
      - name: Membership completion regressions
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/NajmBahar/MembershipFeeCompletionEvidenceTest.php
      - name: Existing financial safety checks
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/NajmBahar/MembershipFeePaymentTest.php tests/Feature/NajmBahar/MembershipFeePolicyIntegrityTest.php tests/Feature/NajmBahar/TransactionReservationProtectionTest.php tests/Feature/NajmBahar/ActiveReservationCommittedDimInvariantTest.php tests/Feature/NajmBahar/TransactionIdempotencyHardeningTest.php
      - name: Membership consent contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmBaharMembershipConsentContractTest.php tests/Feature/Api/V1/NajmBaharMembershipFeeContractTest.php tests/Feature/Api/V1/NajmBaharMobileJourneyTest.php tests/Feature/Api/V1/IdempotencyContractTest.php
  native-wire:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Normalize formatting and retain exact patch
        working-directory: apps/mobile
        run: |
          dart format lib test integration_test
          echo NB_FORMAT_PATCH_BEGIN
          git diff --no-color -- lib test integration_test
          echo NB_FORMAT_PATCH_END
      - name: Native payment wire and existing retry checks
        working-directory: apps/mobile
        run: flutter test --reporter expanded test/features/najm_bahar/najm_bahar_membership_payment_repository_test.dart test/core/api/api_client_test.dart test/core/api/retry_policy_test.dart test/features/najm_bahar/najm_bahar_policy_test.dart test/features/najm_bahar/najm_bahar_repository_test.dart
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze


  final-server:
    if: github.ref == 'refs/heads/agent/mobile-membership-candidate-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Prepare isolated Laravel test runtime
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs final-evidence
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --no-audit --no-fund
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          php artisan migrate:fresh --force
          npm run build
          test -f public/build/manifest.json
          grep -F 'resources/js/app.js' public/build/manifest.json >/dev/null
      - name: Financial mutation architecture gate
        run: |
          set -o pipefail
          vendor/bin/phpunit -c phpunit.xml.dist tests/Architecture/NajmBaharFinancialMutationBoundaryTest.php 2>&1 | tee final-evidence/server-architecture.log
      - name: Full server suite
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          grep -F 'resources/js/app.js' public/build/manifest.json >/dev/null
          vendor/bin/phpunit -c phpunit.xml.dist 2>&1 | tee final-evidence/server-full.log
      - name: Retain server final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: membership-final-server-${{ github.sha }}
          path: final-evidence/
          if-no-files-found: error
          retention-days: 30

  final-mobile:
    if: github.ref == 'refs/heads/agent/mobile-membership-candidate-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Strict formatter
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyzer
        working-directory: apps/mobile
        run: flutter analyze
      - name: Complete Flutter test suite
        working-directory: apps/mobile
        run: |
          set -o pipefail
          mkdir -p ../../final-mobile-evidence
          flutter test --reporter expanded 2>&1 | tee ../../final-mobile-evidence/flutter-full.log
      - name: Retain mobile final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: membership-final-mobile-${{ github.sha }}
          path: final-mobile-evidence/
          if-no-files-found: error
          retention-days: 30
