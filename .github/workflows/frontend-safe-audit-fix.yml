name: Frontend Safe Audit Fix

on:
  push:
    branches:
      - agent/najm-hoda-frontend-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: agent/najm-hoda-frontend-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply non-breaking production audit fixes
        run: npm audit fix --omit=dev || true

      - name: Capture safe package metadata
        run: |
          cp package.json /tmp/package.json.safe
          cp package-lock.json /tmp/package-lock.json.safe

      - name: Restore full dependency tree for build validation
        run: npm install --include=dev --ignore-scripts=false

      - name: Restore safe package metadata
        run: |
          cp /tmp/package.json.safe package.json
          cp /tmp/package-lock.json.safe package-lock.json

      - name: Build production assets
        run: npm run build

      - name: Report remaining production high/critical advisories
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          const counts = data.metadata?.vulnerabilities || {};
          console.log('COUNTS', JSON.stringify(counts));
          for (const [name,v] of Object.entries(data.vulnerabilities || {})) {
            if (['critical','high'].includes(v.severity)) {
              console.log('VULN', JSON.stringify({name,severity:v.severity,direct:!!v.isDirect,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==='string'?x:(x.name||name)).slice(0,8)}));
            }
          }
          NODE

      - name: Commit safe package metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No safe npm audit changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: apply non-breaking frontend dependency fixes'
          git push origin HEAD:agent/najm-hoda-frontend-audit
