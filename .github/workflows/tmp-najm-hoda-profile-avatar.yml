    .hoda-transparency { background: linear-gradient(180deg,#fffdf6,#fff); border-color: #f0dfaa; }
    .hoda-note { display: flex; gap: .7rem; align-items: flex-start; color: #6d5a24; line-height: 1.9; }
    @media (max-width: 760px) {
