name: Temporary Najm Hoda Profile Avatar Apply

on:
  push:
    branches:
      - agent/najm-hoda-widget-viewport-safety

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify RED contract
        shell: bash
        run: |
          set +e
          php artisan test tests/Feature/NajmHoda/NajmHodaWidgetAvatarContractTest.php
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected Najm Hoda identity/profile contract to be RED before implementation."
            exit 1
          fi
          echo "RED contract confirmed."

      - name: Apply focused Najm Hoda identity and profile implementation
        shell: python
        run: |
          from pathlib import Path

          routes = Path('routes/web.php')
          text = routes.read_text(encoding='utf-8')
          needle = "    Route::get('/profile-member/{user}', [ProfileController::class, 'showProfileMember'])->name('profile.member.show');"
          insert = "    Route::get('/najm-hoda', [ProfileController::class, 'showNajmHodaProfile'])->name('najm-hoda.profile');\n\n" + needle
          if "name('najm-hoda.profile')" not in text:
              if needle not in text:
                  raise SystemExit('profile member route anchor not found')
              text = text.replace(needle, insert, 1)
          routes.write_text(text, encoding='utf-8')

          controller = Path('app/Http/Controllers/Profile/ProfileController.php')
          text = controller.read_text(encoding='utf-8')
          method_anchor = "    public function showProfileMember(User $user)\n    {\n"
          profile_method = """    public function showNajmHodaProfile()\n    {\n        $email = (string) config('najm-hoda.group_assistant.bot_email', 'najm-hoda-bot@local.invalid');\n        $najmHoda = User::where('email', $email)->first();\n\n        if (! $najmHoda) {\n            $najmHoda = app(\\App\\Services\\NajmHoda\\NajmHodaGroupAssistantService::class)->ensureBotUser();\n        }\n\n        return view('profile.najm-hoda', compact('najmHoda'));\n    }\n\n"""
          if 'public function showNajmHodaProfile()' not in text:
              if method_anchor not in text:
                  raise SystemExit('showProfileMember anchor not found')
              text = text.replace(method_anchor, profile_method + method_anchor, 1)

          redirect_anchor = method_anchor
          redirect_body = """    public function showProfileMember(User $user)\n    {\n        $najmHodaEmail = (string) config('najm-hoda.group_assistant.bot_email', 'najm-hoda-bot@local.invalid');\n        if ($user->isSystemIdentity() && $user->email === $najmHodaEmail) {\n            return redirect()->route('najm-hoda.profile');\n        }\n\n"""
          if "$najmHodaEmail" not in text:
              if redirect_anchor not in text:
                  raise SystemExit('profile redirect anchor not found')
              text = text.replace(redirect_anchor, redirect_body, 1)
          controller.write_text(text, encoding='utf-8')

          view = Path('resources/views/profile/najm-hoda.blade.php')
          view.parent.mkdir(parents=True, exist_ok=True)
          view.write_text(r'''@extends('layouts.unified')

