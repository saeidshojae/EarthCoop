    .hoda-section { margin-top: 1.25rem; padding: 1.3rem; border-radius: 20px; background: #fff; border: 1px solid #e5e9ef; }
    .hoda-section h2 { font-size: 1.12rem; font-weight: 900; color: #172033; margin: 0 0 .85rem; }
    .hoda-examples { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .75rem; }
