name: Ticket SLA Hotfix Targeted Gate

on:
  push:
    branches:
      - hotfix/ticket-sla-null-created-at-20261006
    paths:
      - 'app/Models/Ticket.php'
      - 'app/Services/TicketSlaService.php'
      - 'tests/Feature/Support/TicketSlaHotfixTest.php'
      - '.github/workflows/ticket-sla-hotfix-targeted.yml'

permissions:
  contents: read

concurrency:
  group: ticket-sla-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ticket-sla-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_mysql, gd
          coverage: none
      - name: Prepare writable Laravel paths
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare Laravel runtime
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Run ticket SLA regression
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Support/TicketSlaHotfixTest.php
