name: Native Bahar transfer mobile

on:
  push:
    branches: [agent/mobile-bahar-transfer-20261007]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-bahar-transfer-native.yml'

permissions:
  contents: read

concurrency:
  group: native-bahar-transfer-mobile
  cancel-in-progress: true

jobs:
  native-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Normalize formatter and expose canonical transfer sources
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          dart format lib test
          for file in \
            lib/features/najm_bahar/najm_bahar_repository.dart \
            lib/features/najm_bahar/najm_bahar_transfer_dto.dart \
            lib/features/najm_bahar/najm_bahar_transfer_section.dart \
            test/features/najm_bahar/najm_bahar_transfer_controller_test.dart \
            test/features/najm_bahar/najm_bahar_transfer_repository_test.dart
          do
            echo "TRANSFER_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "TRANSFER_FORMAT_END:$file"
          done
      - name: Transfer widget contract
        working-directory: apps/mobile
        run: timeout 180s flutter test --timeout 20s --reporter expanded test/features/najm_bahar/najm_bahar_transfer_screen_test.dart
      - name: Transfer wire contract
        working-directory: apps/mobile
        run: flutter test --timeout 20s --reporter expanded test/features/najm_bahar/najm_bahar_transfer_repository_test.dart test/features/najm_bahar/najm_bahar_transfer_controller_test.dart test/features/najm_bahar/najm_bahar_membership_payment_repository_test.dart test/core/api/api_client_test.dart
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
