name: Temporal user support chat one-shot patch helper

on:
  push:
    branches:
      - agent/temporal-user-support-chat-patch-helper-20261005
    paths:
      - .github/workflows/temporal-user-support-chat-patch-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/temporal-user-support-chat-patch-helper-20261005
          fetch-depth: 0

      - name: Apply exact one-shot patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/views/user/support-chat/index.blade.php')
          data = path.read_bytes()
          old = b"{{ \\Morilog\\Jalali\\Jalalian::fromCarbon($message->created_at)->format('H:i') }}"
          new = b'<x-temporal.time :value="$message->created_at" />'

          count = data.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 legacy support-chat time expression, found {count}')

          path.write_bytes(data.replace(old, new))

      - name: Verify and commit only intended patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporal-user-support-chat-patch-helper.yml

          changed="$(git diff --name-only HEAD | sort)"
          expected=$'.github/workflows/temporal-user-support-chat-patch-helper.yml\nresources/views/user/support-chat/index.blade.php'
          test "$changed" = "$expected"

          test "$(grep -F -c '<x-temporal.time :value="$message->created_at" />' resources/views/user/support-chat/index.blade.php)" -eq 1
          test "$(grep -F -c 'Jalalian::' resources/views/user/support-chat/index.blade.php || true)" -eq 0
          test "$(grep -F -c 'Morilog\\Jalali' resources/views/user/support-chat/index.blade.php || true)" -eq 0

          git config user.name 'earthcoop-temporal-helper'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(temporal): use shared time component in user support chat'
          git push origin HEAD:agent/temporal-user-support-chat-patch-helper-20261005
