name: Invitation Welcome Link Repair

on:
  push:
    branches:
      - agent/welcome-community-stories
    paths:
      - .github/workflows/invitation-welcome-link-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/welcome-community-stories
          fetch-depth: 0
      - name: Add invitation deep-link handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/welcome.blade.php')
          text = path.read_text()
          marker = "        // Auto-open modal if validation errors exist\n"
          addition = """        // Invitation links open registration with the invitation code prefilled.\n        const searchParams = new URLSearchParams(window.location.search);\n        const invitationCode = searchParams.get('invite');\n        if (invitationCode) {\n            const inviteInput = document.querySelector('[name=\"invite_code\"]');\n            if (inviteInput) {\n                inviteInput.value = invitationCode;\n                openModal();\n            }\n        }\n\n"""

          if "searchParams.get('invite')" not in text:
              if marker not in text:
                  raise SystemExit('welcome insertion marker not found')
              text = text.replace(marker, addition + marker, 1)
              path.write_text(text)
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/invitation-welcome-link-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/welcome.blade.php .github/workflows/invitation-welcome-link-repair.yml
          git commit -m "feat: prefill registration from invitation link"
          git push origin HEAD:agent/welcome-community-stories
