name: Doctrine DBAL Removal Resolver

on:
  push:
    branches:
      - agent/najm-hoda-hardening
    paths:
      - 'docs/DOCTRINE_DBAL_REMOVAL_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/najm-hoda-hardening

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, zip, gd, pdo_mysql
          coverage: none

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache storage/framework/sessions
          chmod -R 775 bootstrap/cache storage/framework

      - name: Remove tracked legacy vendor tree
        run: rm -rf vendor

      - name: Remove direct DBAL requirement without installing
        run: composer remove doctrine/dbal --no-update --no-interaction

      - name: Resolve dependency graph without scripts
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress --no-install --no-scripts

      - name: Clean-install resolved dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify DBAL and abandoned cache are gone
        run: |
          if composer show doctrine/dbal >/dev/null 2>&1; then
            echo 'doctrine/dbal is still installed'
            composer why doctrine/dbal || true
            exit 1
          fi
          if composer show doctrine/cache >/dev/null 2>&1; then
            echo 'doctrine/cache is still installed'
            composer why doctrine/cache || true
            exit 1
          fi

      - name: Enforce production advisory gate
        run: composer audit --no-dev --abandoned=report

      - name: Commit Composer-generated removal
        run: |
          if git diff --quiet -- composer.json composer.lock; then
            echo 'No dependency changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          git commit -m 'deps: remove unused Doctrine DBAL legacy chain'
          git push origin HEAD:agent/najm-hoda-hardening
