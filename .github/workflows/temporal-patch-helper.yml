name: Temporal one-shot patch helper

on:
  push:
    branches:
      - agent/temporal-patch-helper-20261005
    paths:
      - .github/workflows/temporal-patch-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/temporal-patch-helper-20261005
          fetch-depth: 0

      - name: Apply exact one-shot patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/views/admin/tickets/index.blade.php')
          old = "{{ \\Morilog\\Jalali\\Jalalian::fromCarbon($ticket->created_at)->format('Y/m/d H:i') }}"
          new = '<x-temporal.date-time :value="$ticket->created_at" />'

          data = path.read_text(encoding='utf-8')
          count = data.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 legacy occurrence, found {count}')

          path.write_text(data.replace(old, new), encoding='utf-8', newline='')

      - name: Verify and commit only intended patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporal-patch-helper.yml
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected=$'.github/workflows/temporal-patch-helper.yml\nresources/views/admin/tickets/index.blade.php'
          test "$changed" = "$expected"

          test "$(grep -F -c '<x-temporal.date-time :value="$ticket->created_at" />' resources/views/admin/tickets/index.blade.php)" -eq 1
          test "$(grep -F -c 'Jalalian::' resources/views/admin/tickets/index.blade.php || true)" -eq 0
          test "$(grep -F -c 'Morilog\\Jalali' resources/views/admin/tickets/index.blade.php || true)" -eq 0

          git config user.name 'earthcoop-temporal-helper'
          git config user.email 'actions@users.noreply.github.com'
          git add resources/views/admin/tickets/index.blade.php .github/workflows/temporal-patch-helper.yml
          git commit -m 'fix(temporal): use shared date-time component in admin tickets index'
          git push origin HEAD:agent/temporal-patch-helper-20261005
