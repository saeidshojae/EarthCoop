name: Frontend Runtime Security

on:
  push:
    branches:
      - agent/frontend-runtime-security
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - resources/js/**
      - resources/css/**
      - resources/views/**
      - app/Modules/**/Views/**
      - vite.config.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject legacy Swiper asset references
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=vendor 'vendor/swiper/swiper-element-bundle.min.js' resources app; then
            echo 'Legacy vendored Swiper reference detected. Use the Vite-managed swiper/element/bundle entrypoint instead.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Block production npm vulnerabilities
        run: npm audit --omit=dev --audit-level=low
