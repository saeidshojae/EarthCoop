name: Native attachment checkpoint
on:
  push:
    branches: [agent/native-attachment-verification-20261004]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Validate Firebase configuration materialization
        run: python -m unittest discover -s tests/mobile -p 'test_firebase_configuration.py'
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter test test/features/groups/group_detail_screen_test.dart
        working-directory: apps/mobile
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile

