name: RC Composer Cleanup

on:
  push:
    branches:
      - agent/najm-hoda-hardening
    paths:
      - .github/workflows/rc-composer-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/najm-hoda-hardening
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions
          chmod -R 775 bootstrap/cache storage/framework

      - name: Remove tracked legacy vendor tree
        run: rm -rf vendor

      - name: Align PHP and Ignition constraints
        run: |
          composer require php:^8.2 --no-update --no-interaction
          composer remove spatie/laravel-ignition --no-update --no-interaction
          composer require --dev spatie/laravel-ignition:^2.0 --no-update --no-interaction
          composer update spatie/laravel-ignition --with-all-dependencies --prefer-dist --no-scripts --no-interaction --no-progress

      - name: Validate clean install and audit
        run: |
          rm -rf vendor
          composer install --prefer-dist --no-interaction --no-progress
          composer validate --no-check-publish
          composer audit --no-dev --abandoned=report

      - name: Commit generated Composer metadata
        run: |
          if git diff --quiet -- composer.json composer.lock; then
            echo "No Composer changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git commit -m "build: align Laravel 12 runtime constraints"
          git push origin HEAD:agent/najm-hoda-hardening
