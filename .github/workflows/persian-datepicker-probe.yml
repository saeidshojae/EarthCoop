name: Persian Datepicker Migration Probe

on:
  push:
    branches:
      - agent/frontend-persian-datepicker-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: agent/frontend-persian-datepicker-probe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install baseline dependencies
        run: npm ci

      - name: Upgrade persian-datepicker to 1.2.0
        run: npm install persian-datepicker@1.2.0 --save-exact

      - name: Build production assets
        run: npm run build

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          const counts = data.metadata?.vulnerabilities || {};
          console.log('COUNTS', JSON.stringify(counts));
          for (const name of ['persian-datepicker','jquery','cross-spawn','tmp','eslint','ajv']) {
            console.log(name.toUpperCase().replaceAll('-','_'), JSON.stringify(data.vulnerabilities?.[name] || null));
          }
          NODE

      - name: Commit probe package metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security: probe persian-datepicker 1.2.0'
          git push origin HEAD:agent/frontend-persian-datepicker-probe
