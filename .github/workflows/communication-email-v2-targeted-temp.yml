name: Communication Email Content V2 Targeted

on:
  push:
    branches:
      - feat/communication-email-content-v2-20261007

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_mysql, gd
          coverage: none
      - name: Prepare Laravel paths
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare runtime
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          APP_TIMEZONE=Asia/Tehran
          LOG_CHANNEL=stack
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          php artisan migrate:fresh --force
      - name: Run targeted communication email v2 tests
        run: |
          vendor/bin/phpunit -c phpunit.xml.dist \
            tests/Feature/Communication/ProfessionalEmailContentV2Test.php \
            tests/Feature/Communication/WeeklyMemberReportTest.php \
            tests/Feature/Communication/CommunicationCenterClosureTest.php \
            tests/Feature/Communication/InvitationEmailMigrationTest.php \
            tests/Feature/Communication/InvitationLegacyPathMigrationTest.php \
            tests/Feature/NajmHoda/InvitationManagementServiceTest.php \
            tests/Architecture/CommunicationDeliveryBoundaryTest.php
