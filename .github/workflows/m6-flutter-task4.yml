name: M6 Flutter Task 4 TDD

on:
  push:
    branches:
      - agent/flutter-native-client-foundation-20260929
    paths:
      - 'apps/mobile/lib/core/auth/**'
      - 'apps/mobile/lib/core/device/**'
      - 'apps/mobile/lib/features/auth/**'
      - 'apps/mobile/lib/core/api/api_client.dart'
      - 'apps/mobile/lib/core/api/request_context.dart'
      - 'apps/mobile/test/core/auth/**'
      - 'apps/mobile/test/features/auth/**'
      - '.github/workflows/m6-flutter-task4.yml'

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check formatting
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          scopes=(test/core/auth test/features/auth)
          [ ! -d lib/core/auth ] || scopes+=(lib/core/auth)
          [ ! -d lib/core/device ] || scopes+=(lib/core/device)
          [ ! -d lib/features/auth ] || scopes+=(lib/features/auth)
          dart format "${scopes[@]}"
          git diff -- "${scopes[@]}"
          git diff --exit-code -- "${scopes[@]}"
      - name: Analyze auth scope
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          scopes=(test/core/auth test/features/auth lib/core/api/api_client.dart lib/core/api/request_context.dart)
          [ ! -d lib/core/auth ] || scopes+=(lib/core/auth)
          [ ! -d lib/core/device ] || scopes+=(lib/core/device)
          [ ! -d lib/features/auth ] || scopes+=(lib/features/auth)
          flutter analyze "${scopes[@]}"
      - name: Run Task 4 auth contracts
        working-directory: apps/mobile
        run: flutter test test/core/auth test/features/auth
