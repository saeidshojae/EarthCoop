name: Economic Release C CI

on:
  push:
    branches:
      - agent/economic-system-release-c
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: economic-release-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  membership-lifecycle:
    name: Membership lifecycle and estate safety
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs

      - name: Remove tracked legacy vendor tree
        run: rm -rf vendor

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite assets
        run: npm run build

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_MOCK_MODE=true
          EOF
          php artisan key:generate --force

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Release C membership-removal gate
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/NajmBahar/MembershipRemovalServiceTest.php tests/Feature/NajmBahar/MembershipRetirementServiceTest.php

      - name: Run Release C canonical account adapters gate
        run: |
          php vendor/bin/phpunit --configuration phpunit.xml.dist \
            tests/Feature/NajmBahar/SafeTransactionServiceInvariantTest.php \
            tests/Feature/NajmBahar/SafeSubAccountServiceInvariantTest.php \
            tests/Feature/NajmBahar/ScheduledSubAccountTransferExecutorTest.php

      - name: Re-run Release B Governance gate
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Governance

      - name: Re-run Release A monetary regression gate
        run: |
          php vendor/bin/phpunit --configuration phpunit.xml.dist \
            tests/Feature/NajmBahar/AccountBalanceServiceTest.php \
            tests/Feature/NajmBahar/AccountInvariantServiceTest.php \
            tests/Feature/NajmBahar/DimTransferRestrictionTest.php \
            tests/Feature/NajmBahar/InitialMembershipCreditTest.php \
            tests/Feature/NajmBahar/InternalAccountTransferServiceTest.php \
            tests/Feature/NajmBahar/MembershipFeePaymentTest.php \
            tests/Feature/NajmBahar/MonetaryPolicyServiceTest.php \
            tests/Feature/NajmBahar/MonetaryServiceTest.php \
            tests/Feature/NajmBahar/RetirementLiabilitySettlementServiceTest.php \
            tests/Feature/NajmBahar/TreasuryServiceTest.php \
            tests/Unit/NajmBahar/NajmBaharConstitutionTest.php
