name: EarthCoop Secretariat S5 PR Validation

on:
  pull_request:
    branches:
      - agent/secretariat-s5-ci-base

permissions:
  contents: read

jobs:
  secretariat-s5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: earthcoop_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          cat >> .env <<'EOF'
          APP_ENV=testing
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=earthcoop_test
          DB_USERNAME=root
          DB_PASSWORD=root
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          EOF

      - name: PHP syntax gate for Secretariat S1-S5
        run: |
          find app/Modules/Secretariat tests/Feature/Secretariat database/migrations -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Fresh migration
        run: php artisan migrate:fresh --force

      - name: Verify S5 schema rollback and re-apply
        run: |
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force

      - name: Run all Secretariat S1-S5 feature tests
        run: php artisan test tests/Feature/Secretariat

      - name: Run group authorization regressions
        run: |
          php artisan test tests/Feature/MessageAuthorizationTest.php
          php artisan test tests/Feature/GroupRoleManagementTest.php
