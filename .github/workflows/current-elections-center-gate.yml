name: Current Elections Center Gate

on:
  push:
    branches:
      - agent/current-elections-center
  pull_request:
    branches:
      - agent/participation-credit-regulation

jobs:
  current-elections-center:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_current_elections
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_current_elections
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          EOF
          php artisan key:generate --force
      - name: Migrate schema
        run: php artisan migrate:fresh --force
      - name: Validate application and history routes
        run: |
          php artisan about
          php artisan route:list --name=history
      - name: Run current center contract test
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections/CurrentElectionCenterServiceContractTest.php
      - name: Run current center behavior test
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections/CurrentElectionCenterServiceTest.php
      - name: Run current/history route split test
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections/CurrentElectionRoutesTest.php
      - name: Run current center view test
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections/CurrentElectionCenterViewTest.php
      - name: Run current center responsive contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections/CurrentElectionCenterResponsiveContractTest.php
      - name: Run election history navigation contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections/ElectionHistoryNavigationTest.php
      - name: Run poll separation contract
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections/CurrentPollSeparationTest.php
      - name: Run elections regression suite
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections
