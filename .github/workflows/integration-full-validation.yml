name: EarthCoop Integration Full Validation

on:
  push:
    branches:
      - agent/integration-hoda-bahar-after-groups
      - agent/integration-secretariat-s9-current-main
      - agent/elections-systemic-rebuild
      - agent/pre-main-ui-polish
  pull_request:
    branches:
      - main
      - agent/integration-pre-elections-current-main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthcoop-integration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs regression-logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs

      - name: Install backend dependencies from lock
        run: |
          rm -rf vendor
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress

      - name: Install and build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json
          grep -F 'resources/js/app.js' public/build/manifest.json >/dev/null

      - name: Create isolated test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_testing
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          NAJM_HODA_ENABLED=true
          NAJM_HODA_MOCK_MODE=true
          NAJM_HODA_RUNTIME_EVENT_BUS_DRIVER=database
          EOF
          php artisan key:generate --force

      - name: Provision phpunit forced database
        run: mysql --host=127.0.0.1 --port=3306 --user=root -e 'CREATE DATABASE IF NOT EXISTS `newearthcoop-test` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'

      - name: Migrate full integrated schemas
        run: |
          php artisan migrate --force
          DB_DATABASE=newearthcoop-test php artisan migrate --force

      - name: Validate route and command boot
        run: |
          php artisan route:list > /tmp/routes.txt
          grep -F 'najm-hoda' /tmp/routes.txt >/dev/null
          grep -F 'najm-bahar' /tmp/routes.txt >/dev/null
          php artisan list > /tmp/commands.txt
          grep -F 'najm-hoda:production-readiness' /tmp/commands.txt >/dev/null
          grep -F 'najm-bahar:production-readiness' /tmp/commands.txt >/dev/null
          grep -F 'elections:audit-data' /tmp/commands.txt >/dev/null
          php artisan elections:audit-data --json --fail-on-issues

      - name: Regression — Group Chat
        id: regression_group_chat
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/GroupChat 2>&1 | tee regression-logs/group-chat.log

      - name: Regression — Group Admin / Identity
        id: regression_group_admin_identity
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist \
            tests/Feature/Admin/GlobalGroupRoleManagementTest.php \
            tests/Feature/Admin/GroupRoleManagementTest.php \
            tests/Feature/Admin/RealtimeSettingsTest.php \
            tests/Feature/SystemIdentityIsolationTest.php \
            tests/Feature/ChatRequestFlowTest.php 2>&1 | tee regression-logs/group-admin-identity.log

      - name: Regression — Najm Hoda + n8n
        id: regression_najm_hoda
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/NajmHoda 2>&1 | tee regression-logs/najm-hoda.log

      - name: Regression — Governance
        id: regression_governance
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Governance 2>&1 | tee regression-logs/governance.log

      - name: Regression — Najm Bahar
        id: regression_najm_bahar
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist \
            tests/Feature/NajmBahar \
            tests/Unit/NajmBahar \
            tests/Architecture/NajmBaharFinancialMutationBoundaryTest.php 2>&1 | tee regression-logs/najm-bahar.log

      - name: Regression — Stock
        id: regression_stock
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/Stock 2>&1 | tee regression-logs/stock.log

      - name: Regression — Group Chat JavaScript
        id: regression_group_chat_js
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:group-chat 2>&1 | tee regression-logs/group-chat-js.log

      - name: Reset phpunit database for full suite
        if: ${{ !cancelled() }}
        run: DB_DATABASE=newearthcoop-test php artisan migrate:fresh --force

      - name: Regression — Full Project PHPUnit
        id: regression_full_phpunit
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist 2>&1 | tee regression-logs/full-phpunit.log

      - name: Upload regression diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-regression-logs
          path: regression-logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce regression gate
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GROUP_CHAT: ${{ steps.regression_group_chat.outcome }}
          GROUP_ADMIN_IDENTITY: ${{ steps.regression_group_admin_identity.outcome }}
          NAJM_HODA: ${{ steps.regression_najm_hoda.outcome }}
          GOVERNANCE: ${{ steps.regression_governance.outcome }}
          NAJM_BAHAR: ${{ steps.regression_najm_bahar.outcome }}
          STOCK: ${{ steps.regression_stock.outcome }}
          GROUP_CHAT_JS: ${{ steps.regression_group_chat_js.outcome }}
          FULL_PHPUNIT: ${{ steps.regression_full_phpunit.outcome }}
        run: |
          printf '%-28s %s\n' \
            'Group Chat' "$GROUP_CHAT" \
            'Group Admin / Identity' "$GROUP_ADMIN_IDENTITY" \
            'Najm Hoda + n8n' "$NAJM_HODA" \
            'Governance' "$GOVERNANCE" \
            'Najm Bahar' "$NAJM_BAHAR" \
            'Stock' "$STOCK" \
            'Group Chat JavaScript' "$GROUP_CHAT_JS" \
            'Full Project PHPUnit' "$FULL_PHPUNIT"

          if printf '%s\n' \
            "$GROUP_CHAT" \
            "$GROUP_ADMIN_IDENTITY" \
            "$NAJM_HODA" \
            "$GOVERNANCE" \
            "$NAJM_BAHAR" \
            "$STOCK" \
            "$GROUP_CHAT_JS" \
            "$FULL_PHPUNIT" | grep -qv '^success$'; then
            echo 'One or more regression suites failed.'
            exit 1
          fi