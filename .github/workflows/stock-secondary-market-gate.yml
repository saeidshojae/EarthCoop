name: Stock Secondary Market Gate

on:
  push:
    branches:
      - agent/stock-slice-6-secondary-market-gate
  pull_request:
    branches:
      - agent/integration-secretariat-s9-current-main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-secondary-market-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs test-results
          chmod -R 775 bootstrap/cache storage/framework storage/logs

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create isolated test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_testing
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          STOCK_SECONDARY_MARKET_ENABLED=false
          EOF
          php artisan key:generate --force
          mysql --host=127.0.0.1 --port=3306 --user=root -e 'CREATE DATABASE IF NOT EXISTS `newearthcoop-test` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'

      - name: Fresh migration gate
        run: |
          php artisan migrate:fresh --force
          DB_DATABASE=newearthcoop-test php artisan migrate:fresh --force
          mysql --host=127.0.0.1 --port=3306 --user=root newearthcoop-test -e "SHOW COLUMNS FROM stocks LIKE 'issuer_type'; SHOW COLUMNS FROM auctions LIKE 'market_type';"

      - name: Stock PHPUnit
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml.dist \
            tests/Unit/Stock tests/Feature/Stock \
            --log-junit test-results/stock-junit.xml 2>&1 | tee test-results/stock-phpunit.log

      - name: Upload Stock diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stock-secondary-market-gate-results
          path: test-results/*
          if-no-files-found: warn
          retention-days: 7
