name: Temporary Temporal bootstrap diagnostic

on:
  push:
    branches:
      - agent/communication-temporal-integration-20261006

permissions:
  contents: read

jobs:
  diagnose:
    if: "github.event.head_commit.message == 'chore(ci): diagnose temporal bootstrap merge'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/temporal-system-20261001
          set +e
          git merge --no-commit --no-ff 61fa6cd5ebb64f9a915adcc5603b34051c811e15
          status=$?
          set -e
          echo "MERGE_STATUS=$status"
          echo "UNMERGED_BEGIN"
          git diff --name-only --diff-filter=U
          echo "UNMERGED_END"
          git merge --abort || true
