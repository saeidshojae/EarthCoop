name: M2 Najm Hoda Targeted Gate

on:
  push:
    branches:
      - agent/m2-najm-hoda-mobile-contract-20260927
    paths:
      - 'app/Services/NajmHoda/**'
      - 'app/Http/Controllers/API/NajmHodaController.php'
      - 'app/Http/Controllers/API/V1/NajmHoda*'
      - 'app/Http/Resources/API/V1/NajmHoda*'
      - 'app/Models/NajmHodaAction.php'
      - 'database/migrations/**najm_hoda**'
      - 'routes/api-v1.php'
      - 'tests/Feature/Api/V1/NajmHoda*'
      - 'tests/Feature/NajmHoda/**'
      - '.github/workflows/m2-najm-hoda-targeted.yml'

permissions:
  contents: read

concurrency:
  group: m2-najm-hoda-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hoda-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_mysql
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          php artisan migrate:fresh --force
      - name: Run M2 conversation boundary contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmHodaConversationContractTest.php
      - name: Run M2 capability contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmHodaCapabilityContractTest.php
      - name: Run M2 authority contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmHodaAuthorityContractTest.php
      - name: Run M2 durable action lifecycle and proposal authorization contracts
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmHodaActionContractTest.php tests/Feature/Api/V1/NajmHodaProposalAuthorizationContractTest.php
      - name: Run M2 native mobile acceptance journey
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmHodaMobileJourneyTest.php
      - name: Run mature Hoda execution capability resource and entry-policy regressions
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/NajmHoda/ExecutionBoundaryTest.php tests/Feature/NajmHoda/InteractionBoundaryTest.php tests/Feature/NajmHoda/CapabilityRegistryTest.php tests/Feature/NajmHoda/ResourceAuthorizationServiceTest.php tests/Feature/NajmHoda/EntryPolicyAndExecutionServiceTest.php
