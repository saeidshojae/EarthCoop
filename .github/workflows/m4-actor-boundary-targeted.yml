name: M4 Actor Boundary Targeted Gate

on:
  push:
    branches:
      - agent/m4-actor-boundary-implementation-20260928
    paths:
      - 'app/Services/Actors/**'
      - 'app/Exceptions/ApiV1ExceptionRenderer.php'
      - 'tests/Unit/Actors/**'
      - 'tests/Feature/Api/V1/TransportContractTest.php'
      - '.github/workflows/m4-actor-boundary-targeted.yml'

permissions:
  contents: read

concurrency:
  group: m4-actor-boundary-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task1-actor-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_sqlite
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          EOF
          php artisan key:generate --force
      - name: Run Task 1 actor identity and transport contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Unit/Actors/ActorReferenceTest.php tests/Feature/Api/V1/TransportContractTest.php
