name: M4 Actor Boundary Targeted Gate

on:
  push:
    branches:
      - agent/m4-actor-boundary-implementation-20260928
    paths:
      - 'app/Services/Actors/**'
      - 'app/Services/Groups/**'
      - 'app/Services/Projects/**'
      - 'app/Modules/NajmBahar/Services/ProjectService.php'
      - 'app/Modules/Secretariat/Policies/SecretariatOfficePolicy.php'
      - 'app/Http/Controllers/API/V1/ActorController.php'
      - 'app/Http/Controllers/API/V1/ProjectController.php'
      - 'app/Policies/Concerns/ResolvesGroupMembership.php'
      - 'app/Policies/NajmBahar/ProjectPolicy.php'
      - 'app/Exceptions/ApiV1ExceptionRenderer.php'
      - 'routes/api-v1.php'
      - 'tests/Unit/Actors/**'
      - 'tests/Unit/NajmBahar/ProjectServiceTest.php'
      - 'tests/Unit/NajmBahar/InvestmentServiceTest.php'
      - 'tests/Feature/Actors/**'
      - 'tests/Feature/Admin/GroupRoleManagementTest.php'
      - 'tests/Feature/Api/V1/ActorContractTest.php'
      - 'tests/Feature/Api/V1/ActorProjectMobileJourneyTest.php'
      - 'tests/Feature/Api/V1/IdempotencyContractTest.php'
      - 'tests/Feature/Api/V1/ProjectActorContractTest.php'
      - 'tests/Feature/Api/V1/TransportContractTest.php'
      - 'tests/Feature/Api/V1/NajmHodaAuthorityContractTest.php'
      - 'tests/Feature/NajmHoda/PageContextResolverTest.php'
      - 'tests/Feature/Api/V1/NajmBaharMobileJourneyTest.php'
      - 'tests/Feature/Api/V1/NajmBaharAccountContractTest.php'
      - 'tests/Feature/Api/V1/NajmBaharTransactionContractTest.php'
      - 'tests/Feature/LocationGovernance/ProjectGovernanceScopeTest.php'
      - 'tests/Feature/NajmBahar/ProjectOwnerNotificationTest.php'
      - 'tests/Feature/Secretariat/SecretariatS5AuthorizationTest.php'
      - 'tests/Feature/Secretariat/SecretariatS6RetrievalTest.php'
      - '.github/workflows/m4-actor-boundary-targeted.yml'

permissions:
  contents: read

concurrency:
  group: m4-actor-boundary-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actor-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, fileinfo, zip, curl, json, pdo_mysql
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop-test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF
          php artisan key:generate --force
          php artisan migrate:fresh --force
      - name: Run Task 1 actor identity and transport contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Unit/Actors/ActorReferenceTest.php tests/Feature/Api/V1/TransportContractTest.php
      - name: Run Task 2 representation and group-role regressions
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Actors/ActorRepresentationAuthorizationTest.php tests/Feature/Admin/GroupRoleManagementTest.php
      - name: Run Task 3 actor discovery contract
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/ActorContractTest.php
      - name: Run Tasks 4-5 actor-aware project contract and core regressions
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/ProjectActorContractTest.php tests/Feature/Api/V1/IdempotencyContractTest.php tests/Feature/Api/V1/CoreJourneyTest.php tests/Feature/Api/V1/ElectionProjectNotificationContractTest.php tests/Feature/LocationGovernance/ProjectGovernanceScopeTest.php
      - name: Run Task 6 project owner notification routing and lifecycle regressions
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/NajmBahar/ProjectOwnerNotificationTest.php tests/Unit/NajmBahar/ProjectServiceTest.php
      - name: Run Task 7 Secretariat project-owner authority and retrieval regressions
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Secretariat/SecretariatS5AuthorizationTest.php tests/Feature/Secretariat/SecretariatS6RetrievalTest.php
      - name: Run Task 8 native actor-project acceptance journey
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/ActorProjectMobileJourneyTest.php
      - name: Run M2 Hoda authority regressions
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmHodaAuthorityContractTest.php tests/Feature/NajmHoda/PageContextResolverTest.php
      - name: Run M3 personal Bahar and investment service regressions
        run: vendor/bin/phpunit -c phpunit.xml.dist tests/Feature/Api/V1/NajmBaharMobileJourneyTest.php tests/Feature/Api/V1/NajmBaharAccountContractTest.php tests/Feature/Api/V1/NajmBaharTransactionContractTest.php tests/Unit/NajmBahar/InvestmentServiceTest.php
