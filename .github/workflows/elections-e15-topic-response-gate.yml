name: Elections E15 E0 Topic Response Gate

on:
  push:
    branches:
      - agent/elections-systemic-rebuild
  pull_request:
    branches:
      - agent/integration-pre-elections-current-main

jobs:
  e15-e0-topic-response:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: newearthcoop_elections_e15
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, openssl, fileinfo, zip, curl, json
          coverage: none
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          chmod -R 775 bootstrap/cache storage/framework storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          cat > .env <<'EOF'
          APP_NAME=EarthCoop
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newearthcoop_elections_e15
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_DRIVER=log
          FILESYSTEM_DISK=local
          EOF
          php artisan key:generate --force
      - name: Migrate topic response schema
        run: php artisan migrate:fresh --force
      - name: Run E0 topic response privacy tests
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections/ElectionFeedbackTopicResponseTest.php
      - name: Re-run elections regression suite
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Elections
      - name: Validate no author linkage exists in topic response table
        run: |
          php artisan tinker --execute='$c=\Illuminate\Support\Facades\Schema::getColumnListing("election_feedback_topic_responses"); throw_if(in_array("feedback_id",$c,true)); throw_if(in_array("ballot_event_id",$c,true)); throw_if(in_array("author_user_id",$c,true));'
