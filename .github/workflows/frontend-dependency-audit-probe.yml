name: Frontend Dependency Audit Probe

on:
  push:
    branches:
      - agent/najm-hoda-frontend-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Production dependency audit
        run: |
          echo '=== npm audit --omit=dev ==='
          npm audit --omit=dev --json > npm-audit-production.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          console.log(JSON.stringify({metadata: data.metadata, vulnerabilities: data.vulnerabilities}, null, 2));
          const counts = data.metadata?.vulnerabilities || {};
          if ((counts.critical || 0) > 0 || (counts.high || 0) > 0) {
            process.exitCode = 2;
          }
          NODE

      - name: Full dependency audit inventory
        if: always()
        run: |
          echo '=== full npm audit package inventory ==='
          npm audit --json > npm-audit-full.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('npm-audit-full.json', 'utf8'));
          const vulns = data.vulnerabilities || {};
          const rows = Object.entries(vulns).map(([name, v]) => ({name, severity: v.severity, direct: v.isDirect, via: v.via, fixAvailable: v.fixAvailable}));
          rows.sort((a,b) => ['critical','high','moderate','low','info'].indexOf(a.severity) - ['critical','high','moderate','low','info'].indexOf(b.severity));
          console.log(JSON.stringify({metadata: data.metadata, packages: rows}, null, 2));
          NODE
