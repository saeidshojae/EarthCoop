name: Frontend Dependency Audit Probe

on:
  push:
    branches:
      - agent/najm-hoda-frontend-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Compact production dependency audit
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          const counts = data.metadata?.vulnerabilities || {};
          console.log('COUNTS', JSON.stringify(counts));
          const severityRank = {critical: 0, high: 1, moderate: 2, low: 3, info: 4};
          const rows = Object.entries(data.vulnerabilities || {})
            .filter(([,v]) => ['critical','high'].includes(v.severity))
            .map(([name,v]) => {
              const via = (v.via || []).map(x => typeof x === 'string' ? x : `${x.name || name}:${x.source || ''}`).slice(0,6);
              const nodes = (v.nodes || []).slice(0,6);
              return {name, severity:v.severity, direct:!!v.isDirect, via, nodes, fixAvailable:v.fixAvailable};
            })
            .sort((a,b) => severityRank[a.severity]-severityRank[b.severity] || a.name.localeCompare(b.name));
          for (const row of rows) console.log('VULN', JSON.stringify(row));
          if (rows.length) process.exitCode = 2;
          NODE

      - name: Trace likely direct runtime packages
        if: always()
        run: |
          npm ls ckeditor4 persian-datepicker jquery bootstrap axios --all --omit=dev || true
