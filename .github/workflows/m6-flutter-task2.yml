name: M6 Flutter Task 2 TDD

on:
  push:
    branches:
      - agent/flutter-native-client-foundation-20260929
    paths:
      - 'apps/mobile/lib/core/api/**'
      - 'apps/mobile/lib/core/logging/**'
      - 'apps/mobile/test/core/api/**'
      - 'apps/mobile/test/core/logging/**'
      - '.github/workflows/m6-flutter-task2.yml'

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check formatting
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/core/api lib/core/logging test/core/api test/core/logging
          git diff -- lib/core/api lib/core/logging test/core/api test/core/logging
          git diff --exit-code -- lib/core/api lib/core/logging test/core/api test/core/logging
      - name: Analyze transport scope
        working-directory: apps/mobile
        run: flutter analyze lib/core/api lib/core/logging test/core/api test/core/logging
      - name: Run Task 2 transport contracts
        working-directory: apps/mobile
        run: |
          flutter test test/core/api/api_client_test.dart test/core/api/retry_policy_test.dart test/core/logging/diagnostics_test.dart
