name: Welcome CTA Repair

on:
  push:
    branches:
      - agent/welcome-community-stories

permissions:
  contents: write

jobs:
  repair:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/welcome-community-stories
          fetch-depth: 0

      - name: Repair Welcome CTA contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'resources/views/partials/projects-section.blade.php': [('px-10 py-5 ', '')],
              'resources/views/partials/how-it-works-section.blade.php': [('px-10 py-5 ', '')],
              'resources/views/partials/invite-section.blade.php': [('px-12 py-5 ', '')],
          }
          for raw, pairs in replacements.items():
              path = Path(raw)
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)

          projects_path = Path('resources/views/partials/projects-section.blade.php')
          projects = projects_path.read_text()
          projects = projects.replace(
              '<a href="{{ route(\'najm-bahar.investments.index\') }}" class="welcome-cta ',
              '<button type="button" onclick="openModal()" aria-controls="registrationModal" class="welcome-cta ',
              1,
          )
          marker = "{{ __('langWelcome.projects_cta') }}"
          idx = projects.find(marker)
          if idx == -1:
              raise SystemExit('projects CTA marker missing')
          close_idx = projects.find('</a>', idx)
          if close_idx != -1:
              projects = projects[:close_idx] + '</button>' + projects[close_idx + 4:]
          if 'onclick="openModal()"' not in projects:
              raise SystemExit('projects CTA registration action was not restored')
          projects_path.write_text(projects)

          copy = {
              'fa': 'برای مشارکت بپیوندید',
              'en': 'Join to participate',
              'ar': 'انضم للمشاركة',
          }
          for locale, value in copy.items():
              path = Path(f'resources/lang/{locale}/langWelcome.php')
              text = path.read_text()
              pattern = r"(^\s*'projects_cta'\s*=>\s*)'[^']*'(\s*,)"
              if not re.search(pattern, text, flags=re.M):
                  raise SystemExit(f'projects_cta missing for {locale}')
              text = re.sub(pattern, lambda m: m.group(1) + "'" + value + "'" + m.group(2), text, count=1, flags=re.M)
              path.write_text(text)

          controller_path = Path('app/Http/Controllers/Auth/Register/StartController.php')
          controller = controller_path.read_text()
          use_line = 'use App\\Services\\ParticipationCreditRegulationService;'
          if use_line not in controller:
              controller = controller.replace(
                  'use App\\Models\\CommunityStory;\n',
                  'use App\\Models\\CommunityStory;\n' + use_line + '\n',
                  1,
              )
          controller = controller.replace(
              'public function showWelcome()\n    {',
              'public function showWelcome(ParticipationCreditRegulationService $participationCreditRegulationService)\n    {',
              1,
          )
          old_return = "return view('welcome', compact('stats', 'communityStories'));"
          new_return = """$participationCreditSnapshot = $participationCreditRegulationService->snapshot();
        $inviteRewardRule = collect($participationCreditSnapshot['actionRules'] ?? [])
            ->firstWhere('key', 'invite_member');

        return view('welcome', compact('stats', 'communityStories', 'inviteRewardRule'));"""
          if old_return in controller:
              controller = controller.replace(old_return, new_return, 1)
          elif "compact('stats', 'communityStories', 'inviteRewardRule')" not in controller:
              raise SystemExit('showWelcome return shape changed unexpectedly')
          controller_path.write_text(controller)

          invite_path = Path('resources/views/partials/invite-section.blade.php')
          invite = invite_path.read_text()
          first_link = '<a href="{{ route(\'participation.credit-regulation\') }}" class="welcome-cta welcome-wide-cta__button '
          replacement = '<a href="{{ route(\'participation.credit-regulation\') }}" data-invite-credit-weight="{{ $inviteRewardRule[\'weight\'] ?? \'\' }}" data-invite-credit-source="{{ $inviteRewardRule[\'source\'] ?? \'current-policy\' }}" class="welcome-cta welcome-wide-cta__button '
          if 'inviteRewardRule' not in invite:
              if first_link not in invite:
                  raise SystemExit('participation regulation CTA shape changed unexpectedly')
              invite = invite.replace(first_link, replacement, 1)
          invite_path.write_text(invite)
          PY

      - name: Commit repaired Welcome surfaces
        run: |
          if git diff --quiet; then
            echo "Welcome CTA repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/partials/projects-section.blade.php resources/views/partials/how-it-works-section.blade.php resources/views/partials/invite-section.blade.php resources/lang/fa/langWelcome.php resources/lang/en/langWelcome.php resources/lang/ar/langWelcome.php app/Http/Controllers/Auth/Register/StartController.php
          git commit -m "fix: restore Welcome CTA and invite credit contracts"
          git push origin HEAD:agent/welcome-community-stories
