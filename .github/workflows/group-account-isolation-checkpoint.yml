name: Group account isolation checkpoint
on:
  push:
    branches: [agent/group-account-isolation-20261005]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Account isolation regression
        working-directory: apps/mobile
        run: flutter test test/features/groups/group_session_isolation_test.dart
