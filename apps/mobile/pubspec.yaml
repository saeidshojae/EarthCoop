name: earthcoop_mobile
description: EarthCoop native mobile client.
publish_to: none
version: 1.0.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  dio: ^5.11.1
  drift: ^2.35.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  go_router: ^18.0.2
  huawei_push: ^6.15.0+300
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  generate: true
